<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bauble of Infinite Christmases</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      cursor: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// ============================================================================
// CORE RENDERER, CAMERA & RENDER TARGETS
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false
});
const maxDpr = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(maxDpr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  48,
  window.innerWidth / window.innerHeight,
  0.05,
  120
);
const portalCam = new THREE.PerspectiveCamera(
  48,
  window.innerWidth / window.innerHeight,
  0.05,
  120
);

const drawingSize = new THREE.Vector2();
renderer.getDrawingBufferSize(drawingSize);

const portalScreenRT = new THREE.WebGLRenderTarget(drawingSize.x, drawingSize.y, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  depthBuffer: true
});

function createCubeRT(size = 256) {
  return new THREE.WebGLCubeRenderTarget(size, {
    generateMipmaps: true,
    minFilter: THREE.LinearMipmapLinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat
  });
}

const cubeRT0 = createCubeRT(256);
const cubeRT1 = createCubeRT(256);
const cubeRT2 = createCubeRT(256);

// ============================================================================
// SHARED MATH & NOISE UTILITIES
// ============================================================================
function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function easeInOutSine(x) {
  return -(Math.cos(Math.PI * x) - 1) / 2;
}

function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// ============================================================================
// POP ART GREYSCALE GLSL SHADERS
// ============================================================================
const sharedUniforms = {
  uTime: { value: 0 },
  uResolution: { value: drawingSize.clone() },
  uLightDir1: { value: new THREE.Vector3(-0.6, 0.78, 0.45).normalize() },
  uLightDir2: { value: new THREE.Vector3(0.75, 0.25, -0.6).normalize() }
};

function createPopArtMaterial({
  baseTone = 0.85,
  shadowTone = 0.12,
  midTone = 0.48,
  emissive = 0.0,
  halftoneScale = 7.0,
  halftoneStrength = 0.65,
  patternType = 0, // 0: none, 1: stripes, 2: concentric rings, 3: moon craters, 4: brushed metal
  patternScale = 6.0,
  rimBoost = 0.35,
  fogDensity = 0.018,
  side = THREE.FrontSide,
  transparent = false,
  opacity = 1.0
} = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: sharedUniforms.uTime,
      uLightDir1: sharedUniforms.uLightDir1,
      uLightDir2: sharedUniforms.uLightDir2,
      uBaseTone: { value: baseTone },
      uShadowTone: { value: shadowTone },
      uMidTone: { value: midTone },
      uEmissive: { value: emissive },
      uHalftoneScale: { value: halftoneScale },
      uHalftoneStrength: { value: halftoneStrength },
      uPatternType: { value: patternType },
      uPatternScale: { value: patternScale },
      uRimBoost: { value: rimBoost },
      uFogDensity: { value: fogDensity },
      uOpacity: { value: opacity }
    },
    side,
    transparent,
    vertexShader: /* glsl */ `
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      varying vec3 vLocalPos;
      varying vec3 vViewDir;

      void main() {
        vLocalPos = position;
        vec4 localPos = vec4(position, 1.0);
        vec3 localNormal = normal;

        #ifdef USE_INSTANCING
          localPos = instanceMatrix * localPos;
          localNormal = mat3(instanceMatrix) * localNormal;
        #endif

        vec4 worldPos = modelMatrix * localPos;
        vWorldPos = worldPos.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * localNormal);

        vec4 mvPos = viewMatrix * worldPos;
        vViewDir = normalize(-mvPos.xyz);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uTime;
      uniform vec3 uLightDir1;
      uniform vec3 uLightDir2;
      uniform float uBaseTone;
      uniform float uShadowTone;
      uniform float uMidTone;
      uniform float uEmissive;
      uniform float uHalftoneScale;
      uniform float uHalftoneStrength;
      uniform float uPatternType;
      uniform float uPatternScale;
      uniform float uRimBoost;
      uniform float uFogDensity;
      uniform float uOpacity;

      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      varying vec3 vLocalPos;
      varying vec3 vViewDir;

      float hash31(vec3 p) {
        p = fract(p * 0.1031);
        p += dot(p, p.yzx + 33.33);
        return fract((p.x + p.y) * p.z);
      }

      float valueNoise(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float n000 = hash31(i);
        float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
        float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
        float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
        float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
        float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
        float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
        float n111 = hash31(i + vec3(1.0, 1.0, 1.0));
        float nx00 = mix(n000, n100, f.x);
        float nx10 = mix(n010, n110, f.x);
        float nx01 = mix(n001, n101, f.x);
        float nx11 = mix(n011, n111, f.x);
        return mix(mix(nx00, nx10, f.y), mix(nx01, nx11, f.y), f.z);
      }

      float benDayDots(vec2 fragCoord, float scale, float coverage) {
        float c = 0.819152; // cos(35 deg)
        float s = 0.573576; // sin(35 deg)
        vec2 rot = vec2(
          fragCoord.x * c - fragCoord.y * s,
          fragCoord.x * s + fragCoord.y * c
        ) / scale;
        vec2 cell = fract(rot) - 0.5;
        float dist = length(cell);
        float radius = clamp(coverage, 0.0, 1.0) * 0.52;
        float aa = max(fwidth(dist), 0.02);
        return 1.0 - smoothstep(radius - aa, radius + aa, dist);
      }

      void main() {
        if (uEmissive > 0.95) {
          float distCam = length(cameraPosition - vWorldPos);
          float fog = exp(-pow(distCam * uFogDensity, 2.0));
          float lum = mix(0.0, 1.0, fog);
          gl_FragColor = vec4(vec3(lum), uOpacity);
          return;
        }

        vec3 N = normalize(vWorldNormal);
        if (!gl_FrontFacing) N = -N;
        vec3 V = normalize(cameraPosition - vWorldPos);

        float ndotl1 = dot(N, uLightDir1) * 0.5 + 0.5;
        float ndotl2 = max(dot(N, uLightDir2), 0.0);
        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);

        float lightVal = ndotl1 * 0.82 + ndotl2 * 0.28 + fresnel * uRimBoost;

        // Graphic stepped cel bands
        float tone;
        if (lightVal > 0.68) {
          tone = uBaseTone;
        } else if (lightVal > 0.42) {
          tone = uMidTone;
        } else {
          tone = uShadowTone;
        }

        // Pattern modulation
        if (uPatternType > 0.5 && uPatternType < 1.5) {
          // Crisp graphic stripes
          float stripe = step(0.5, fract((vLocalPos.x + vLocalPos.y * 0.6) * uPatternScale));
          tone = mix(tone * 0.35, min(1.0, tone * 1.25 + 0.15), stripe);
        } else if (uPatternType >= 1.5 && uPatternType < 2.5) {
          // Concentric Pop Art rings
          float r = length(vLocalPos.xz) * uPatternScale;
          float ring = step(0.48, fract(r));
          tone = mix(uShadowTone, uBaseTone, ring * step(0.28, lightVal));
        } else if (uPatternType >= 2.5 && uPatternType < 3.5) {
          // Moon craters
          float n1 = valueNoise(vLocalPos * uPatternScale);
          float n2 = valueNoise(vLocalPos * uPatternScale * 2.7 + 4.2);
          float crater = smoothstep(0.58, 0.72, n1) * 0.6 + smoothstep(0.62, 0.78, n2) * 0.4;
          tone = mix(tone, uShadowTone * 0.8, crater);
        } else if (uPatternType >= 3.5) {
          // Brushed metallic grooves
          float groove = sin(vLocalPos.y * uPatternScale * 18.0) * 0.5 + 0.5;
          float spec = smoothstep(0.86, 0.90, ndotl1);
          tone = mix(tone * (0.8 + 0.25 * groove), 1.0, spec);
        }

        // Ben-Day halftone dots across mid and shadow bands
        if (uHalftoneStrength > 0.01) {
          float dotCoverage = clamp(1.0 - lightVal * 1.15, 0.12, 0.88);
          float dotMask = benDayDots(gl_FragCoord.xy, uHalftoneScale, dotCoverage);
          float inMid = smoothstep(0.24, 0.34, lightVal) * (1.0 - smoothstep(0.65, 0.76, lightVal));
          float inDark = 1.0 - smoothstep(0.24, 0.36, lightVal);
          // Black dots in midtones, crisp silver dots in deep shadow
          float midDotted = mix(tone, 0.04, dotMask * uHalftoneStrength * inMid);
          float darkDotted = mix(midDotted, uMidTone * 0.85, dotMask * uHalftoneStrength * 0.55 * inDark);
          tone = darkDotted;
        }

        // Crisp comic-book specular slash on bright surfaces
        vec3 H = normalize(uLightDir1 + V);
        float specHighlight = smoothstep(0.955, 0.97, dot(N, H));
        tone = max(tone, specHighlight * uBaseTone);

        // Internal ink edge accent
        float inkEdge = smoothstep(0.84, 0.95, 1.0 - max(dot(N, V), 0.0));
        tone = mix(tone, 0.02, inkEdge * 0.35);

        tone = max(tone, uEmissive);

        // Black distance fog for seamless cosmic void integration
        float distCam = length(cameraPosition - vWorldPos);
        float fog = exp(-pow(distCam * uFogDensity, 2.0));
        tone *= fog;

        gl_FragColor = vec4(vec3(clamp(tone, 0.0, 1.0)), uOpacity);
      }
    `
  });
}

function createInkOutlineMaterial(thickness = 0.035, fogDensity = 0.018) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uThickness: { value: thickness },
      uFogDensity: { value: fogDensity }
    },
    side: THREE.BackSide,
    vertexShader: /* glsl */ `
      uniform float uThickness;
      varying vec3 vWorldPos;
      void main() {
        vec3 pos = position + normalize(normal) * uThickness;
        vec4 localPos = vec4(pos, 1.0);
        #ifdef USE_INSTANCING
          localPos = instanceMatrix * localPos;
        #endif
        vec4 worldPos = modelMatrix * localPos;
        vWorldPos = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uFogDensity;
      varying vec3 vWorldPos;
      void main() {
        // Pure comic ink black
        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
      }
    `
  });
}

// Welds vertex normals at identical positions so sharp box outlines never split
function createSmoothOutlineGeometry(geometry) {
  const geo = geometry.clone();
  const posAttr = geo.attributes.position;
  const normAttr = geo.attributes.normal;
  if (!posAttr || !normAttr) return geo;

  const map = new Map();
  const v = new THREE.Vector3();
  const n = new THREE.Vector3();

  for (let i = 0; i < posAttr.count; i++) {
    v.fromBufferAttribute(posAttr, i);
    n.fromBufferAttribute(normAttr, i);
    const key = `${Math.round(v.x * 1000)}_${Math.round(v.y * 1000)}_${Math.round(v.z * 1000)}`;
    if (!map.has(key)) {
      map.set(key, n.clone());
    } else {
      map.get(key).add(n);
    }
  }

  for (let i = 0; i < posAttr.count; i++) {
    v.fromBufferAttribute(posAttr, i);
    const key = `${Math.round(v.x * 1000)}_${Math.round(v.y * 1000)}_${Math.round(v.z * 1000)}`;
    const avg = map.get(key).clone().normalize();
    normAttr.setXYZ(i, avg.x, avg.y, avg.z);
  }
  normAttr.needsUpdate = true;
  return geo;
}

function addOutline(mesh, thickness = 0.03, smooth = false, fogDensity = 0.018) {
  const geo = smooth ? createSmoothOutlineGeometry(mesh.geometry) : mesh.geometry;
  const outlineMat = createInkOutlineMaterial(thickness, fogDensity);
  const outline = new THREE.Mesh(geo, outlineMat);
  outline.renderOrder = -1;
  mesh.add(outline);
  return outline;
}

// ============================================================================
// THE BAUBLE SHADER (REFLECTION + PARALLAX INTERIOR + HALFTONE + PORTAL)
// ============================================================================
function createBaubleMaterial(envMap, radius = 2.0, {
  invertTone = false,
  geometricWarpBase = 0.0,
  fogDensity = 0.0
} = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uEnvMap: { value: envMap },
      uPortalTex: { value: portalScreenRT.texture },
      uTime: sharedUniforms.uTime,
      uResolution: sharedUniforms.uResolution,
      uLightDir1: sharedUniforms.uLightDir1,
      uLightDir2: sharedUniforms.uLightDir2,
      uRadius: { value: radius },
      uCamDist: { value: 8.5 },
      uPortalProgress: { value: 0.0 },
      uWarpStrength: { value: geometricWarpBase },
      uInvertTone: { value: invertTone ? 1.0 : 0.0 },
      uFogDensity: { value: fogDensity }
    },
    vertexShader: /* glsl */ `
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec3 vLocalPos;

      void main() {
        vLocalPos = position;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform samplerCube uEnvMap;
      uniform sampler2D uPortalTex;
      uniform float uTime;
      uniform vec2 uResolution;
      uniform vec3 uLightDir1;
      uniform vec3 uLightDir2;
      uniform float uRadius;
      uniform float uCamDist;
      uniform float uPortalProgress;
      uniform float uWarpStrength;
      uniform float uInvertTone;
      uniform float uFogDensity;

      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec3 vLocalPos;

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float noise2D(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash21(i);
        float b = hash21(i + vec2(1.0, 0.0));
        float c = hash21(i + vec2(0.0, 1.0));
        float d = hash21(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float luma(vec3 c) {
        return dot(c, vec3(0.299, 0.587, 0.114));
      }

      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);
        float ndotv = max(dot(N, V), 0.0);

        // Spherical coordinates in local space for procedural imperfections & halftone
        vec3 ln = normalize(vLocalPos);
        float theta = atan(ln.z, ln.x);
        float phi = acos(clamp(ln.y, -1.0, 1.0));

        // Subtle procedural surface imperfections (lathe micro-grooves + silver flecks)
        float closeReveal = smoothstep(uRadius * 3.2, uRadius * 1.35, uCamDist);
        float microGroove = sin(phi * 210.0 + sin(theta * 4.0) * 1.5) * 0.5 + 0.5;
        float flecks = noise2D(vec2(theta * 32.0, phi * 32.0));
        float scratch = smoothstep(0.86, 0.98, noise2D(vec2(theta * 14.0, phi * 80.0)));
        vec3 N_imp = normalize(N + vec3(
          (microGroove - 0.5) * 0.035 + (scratch - 0.5) * 0.04,
          (flecks - 0.5) * 0.03,
          (microGroove - 0.5) * 0.035
        ) * (0.35 + 0.65 * closeReveal));

        // Reflection & deep optical refraction vectors
        vec3 R = reflect(-V, N_imp);
        vec3 T = refract(-V, N_imp, 0.74);

        // Subtle geometric / comic-panel distortion as camera approaches or warp increases
        float dynamicWarp = uWarpStrength + closeReveal * 0.22 * (0.5 + 0.5 * sin(uTime * 0.35));
        if (dynamicWarp > 0.01) {
          float facetTheta = floor(atan(R.z, R.x) * 10.0) / 10.0;
          vec3 facetDir = vec3(cos(facetTheta), R.y, sin(facetTheta));
          R = normalize(mix(R, facetDir, dynamicWarp * 0.32));

          float ripple = sin(phi * 16.0 - uTime * 0.6) * 0.08 * dynamicWarp;
          T = normalize(T + N_imp * ripple);
        }

        // Sample live miniature Christmas worlds
        // Outer metallic reflection + deep interior parallax refraction
        float envRefl = luma(textureCube(uEnvMap, R).rgb);
        float envRefr1 = luma(textureCube(uEnvMap, T).rgb);
        float envRefr2 = luma(textureCube(uEnvMap, normalize(T - V * 0.45)).rgb);
        float interiorWorld = mix(envRefr1, envRefr2, 0.42);

        // Pop Art contrast shaping on the reflected/refracted world
        envRefl = smoothstep(0.04, 0.85, envRefl);
        interiorWorld = smoothstep(0.03, 0.82, interiorWorld);

        float fresnel = pow(1.0 - ndotv, 2.4);
        // Center becomes more deeply transparent into the crystal Christmas cosmos as camera nears
        float interiorMix = mix(0.55, 0.90, closeReveal) * (1.0 - fresnel * 0.88);
        float worldTone = mix(envRefl * 0.92 + 0.06, interiorWorld * 1.12, interiorMix);

        // Studio metallic silver & Pop Art comic highlights
        float keyDiffuse = max(dot(N_imp, uLightDir1), 0.0);
        float rimLight = max(dot(N_imp, uLightDir2), 0.0);

        // Crisp hard-edged comic-book studio specular slashes
        float spec1 = smoothstep(0.89, 0.915, dot(R, uLightDir1));
        float spec2 = smoothstep(0.955, 0.97, dot(R, normalize(uLightDir1 + vec3(0.28, -0.18, 0.1))));
        float rimSlash = smoothstep(0.45, 0.56, fresnel * (0.4 + 0.8 * rimLight));

        // Combine silver shell with reflected worlds
        float tone = worldTone * (0.68 + 0.38 * keyDiffuse) + fresnel * 0.24;
        tone = mix(tone, 0.96, rimSlash * 0.65);
        tone = max(tone, spec1 * 0.98);
        tone = max(tone, spec2 * 1.0);

        // Surface imperfections visible up close
        tone += (scratch * 0.08 - (1.0 - microGroove) * 0.035) * closeReveal;

        // Curved Ben-Day Halftone matrix across the sphere surface
        float gridFreq = 86.0;
        vec2 uvHT = vec2(theta * gridFreq * 0.6366, phi * gridFreq);
        float rowShift = mod(floor(uvHT.y), 2.0) * 0.5;
        vec2 cell = fract(vec2(uvHT.x + rowShift, uvHT.y)) - 0.5;
        float dotDist = length(cell);
        float dotRadius = mix(0.42, 0.10, clamp(tone, 0.0, 1.0));
        float aa = max(fwidth(dotDist), 0.03);
        float htDot = 1.0 - smoothstep(dotRadius - aa, dotRadius + aa, dotDist);

        float htZone = smoothstep(0.10, 0.25, tone) * (1.0 - smoothstep(0.75, 0.90, tone));
        float htAmount = mix(0.14, 0.55, closeReveal) * htZone;
        tone = mix(tone, tone < 0.45 ? 0.02 : 0.92, htDot * htAmount);

        if (uInvertTone > 0.5) {
          tone = 1.0 - tone;
        }

        // Crisp black graphic ink contour at the extreme silhouette
        float inkRim = smoothstep(0.91, 0.97, 1.0 - ndotv);
        tone = mix(tone, 0.0, inkRim * 0.85);

        // Seamless Optical Portal Aperture when entering the bauble
        if (uPortalProgress > 0.001) {
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          // Mild edge lensing that flattens completely to 0 as uPortalProgress -> 1
          vec2 centered = screenUV - 0.5;
          float lens = (1.0 - uPortalProgress) * 0.09 * dot(centered, centered);
          vec2 portalUV = clamp(screenUV - centered * lens, 0.001, 0.999);
          float portalLum = luma(texture2D(uPortalTex, portalUV).rgb);

          // Radial aperture opening from the center of the bauble to 100% of screen
          float threshold = 1.0 - uPortalProgress * 1.18;
          float aperture = smoothstep(threshold - 0.08, threshold + 0.08, ndotv);

          // Concentric Pop Art halftone portal rim ring during crossing
          float rimBand = aperture * (1.0 - aperture) * 4.0;
          float portalRing = rimBand * (0.4 + 0.6 * htDot);

          tone = mix(tone, portalLum, aperture);
          tone = mix(tone, 0.98, portalRing * 0.55 * (1.0 - uPortalProgress));
        }

        // Optional cosmic depth fog for nested baubles inside worlds
        if (uFogDensity > 0.0001) {
          float distCam = length(cameraPosition - vWorldPos);
          float fog = exp(-pow(distCam * uFogDensity, 2.0));
          tone *= fog;
        }

        gl_FragColor = vec4(vec3(clamp(tone, 0.0, 1.0)), 1.0);
      }
    `
  });
}

// ============================================================================
// BAUBLE CAP, LOOP & VANISHING THREAD ASSEMBLY
// ============================================================================
function createFlutedCapGeometry(radius, height, ridges = 16) {
  const geo = new THREE.CylinderGeometry(radius * 0.88, radius, height, ridges * 4, 4, false);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const r = Math.hypot(x, z);
    if (r > 0.001) {
      const ang = Math.atan2(z, x);
      const wave = 1.0 + 0.075 * Math.cos(ang * ridges);
      // Taper slightly at very top
      const topTaper = y > height * 0.3 ? 0.92 : 1.0;
      pos.setX(i, x * wave * topTaper);
      pos.setZ(i, z * wave * topTaper);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

function createBaubleAssembly(radius, envMap, {
  invertTone = false,
  geometricWarp = 0.0,
  longThread = false,
  fogDensity = 0.0
} = {}) {
  const group = new THREE.Group();

  // Main reflective sphere
  const sphereGeo = new THREE.SphereGeometry(radius, 84, 84);
  const sphereMat = createBaubleMaterial(envMap, radius, {
    invertTone,
    geometricWarpBase: geometricWarp,
    fogDensity
  });
  const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
  group.add(sphereMesh);

  // Cap group seated cleanly at top of sphere
  const capScale = radius * 0.22;
  const capGroup = new THREE.Group();
  capGroup.position.y = radius * 0.985;

  const metalMat = createPopArtMaterial({
    baseTone: 0.92,
    shadowTone: 0.10,
    midTone: 0.52,
    halftoneScale: 5.5,
    halftoneStrength: 0.55,
    patternType: 4,
    patternScale: 2.0,
    fogDensity
  });

  // Collar base ring
  const collar = new THREE.Mesh(
    new THREE.TorusGeometry(capScale * 0.95, capScale * 0.14, 12, 36),
    metalMat
  );
  collar.rotation.x = Math.PI / 2;
  addOutline(collar, capScale * 0.05, false, fogDensity);
  capGroup.add(collar);

  // Scalloped fluted crown cylinder
  const flutedGeo = createFlutedCapGeometry(capScale * 0.92, capScale * 0.85, 16);
  const flutedMesh = new THREE.Mesh(flutedGeo, metalMat);
  flutedMesh.position.y = capScale * 0.42;
  addOutline(flutedMesh, capScale * 0.05, false, fogDensity);
  capGroup.add(flutedMesh);

  // Top dome
  const topDome = new THREE.Mesh(
    new THREE.SphereGeometry(capScale * 0.72, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.55),
    metalMat
  );
  topDome.position.y = capScale * 0.78;
  addOutline(topDome, capScale * 0.04, false, fogDensity);
  capGroup.add(topDome);

  // Hanging loop
  const loop = new THREE.Mesh(
    new THREE.TorusGeometry(capScale * 0.38, capScale * 0.07, 12, 32),
    metalMat
  );
  loop.position.y = capScale * 1.45;
  addOutline(loop, capScale * 0.035, false, fogDensity);
  capGroup.add(loop);

  // Delicate fine thread vanishing upward into darkness
  const threadLen = longThread ? 28.0 : radius * 6.0;
  const threadGeo = new THREE.CylinderGeometry(
    capScale * 0.015,
    capScale * 0.022,
    threadLen,
    6,
    1
  );
  const threadMat = new THREE.ShaderMaterial({
    uniforms: {
      uLen: { value: threadLen }
    },
    transparent: true,
    vertexShader: /* glsl */ `
      varying float vY;
      void main() {
        vY = position.y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uLen;
      varying float vY;
      void main() {
        float t = clamp((vY + uLen * 0.5) / uLen, 0.0, 1.0);
        float alpha = (1.0 - smoothstep(0.08, 0.92, t)) * 0.72;
        gl_FragColor = vec4(vec3(0.78), alpha);
      }
    `
  });
  const threadMesh = new THREE.Mesh(threadGeo, threadMat);
  threadMesh.position.y = capScale * 1.82 + threadLen * 0.5;
  capGroup.add(threadMesh);

  group.add(capGroup);

  return { group, sphereMesh, sphereMat, capGroup, radius };
}

function createGlowHaloSprite(size = 1.0, opacity = 0.45) {
  const geo = new THREE.PlaneGeometry(size, size);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uOpacity: { value: opacity } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        mvPosition.xy += position.xy;
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uOpacity;
      varying vec2 vUv;
      void main() {
        float d = length(vUv - 0.5) * 2.0;
        float glow = pow(max(0.0, 1.0 - d), 2.2);
        // Subtle Pop-Art graphic ring inside halo
        float ring = smoothstep(0.65, 0.68, d) * (1.0 - smoothstep(0.72, 0.75, d)) * 0.25;
        float lum = (glow + ring) * uOpacity;
        gl_FragColor = vec4(vec3(lum), lum);
      }
    `
  });
  return new THREE.Mesh(geo, mat);
}

function buildVictorianHouse(scale = 1.0, seed = 1, smokeList = null) {
  const rand = seededRandom(seed);
  const g = new THREE.Group();
  const w = 0.55 + rand() * 0.25;
  const h = 0.62 + rand() * 0.35;
  const d = 0.52 + rand() * 0.22;

  // Main body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    rand() > 0.5 ? MAT.charcoalWall : MAT.midWall
  );
  body.position.y = h * 0.5;
  addOutline(body, 0.025, true);
  g.add(body);

  // Gabled pitched snow roof
  const roofH = 0.38 + rand() * 0.14;
  const roofGeo = new THREE.ConeGeometry(Math.max(w, d) * 0.82, roofH, 4);
  roofGeo.rotateY(Math.PI * 0.25);
  const roof = new THREE.Mesh(roofGeo, MAT.snow);
  roof.position.y = h + roofH * 0.48;
  roof.scale.set(w / Math.max(w, d) * 1.08, 1.0, d / Math.max(w, d) * 1.08);
  addOutline(roof, 0.028, true);
  g.add(roof);

  // Chimney
  const chimX = (rand() - 0.5) * w * 0.45;
  const chimZ = (rand() - 0.5) * d * 0.35;
  const chim = new THREE.Mesh(
    new THREE.BoxGeometry(0.11, 0.34, 0.11),
    MAT.darkInk
  );
  chim.position.set(chimX, h + roofH * 0.65, chimZ);
  addOutline(chim, 0.015, true);
  g.add(chim);

  // Glowing white windows (front + sides) with tiny black mullions
  const winGeo = new THREE.PlaneGeometry(0.13, 0.16);
  const winPositions = [
    [-w * 0.23, h * 0.68, d * 0.505, 0],
    [w * 0.23, h * 0.68, d * 0.505, 0],
    [-w * 0.23, h * 0.32, d * 0.505, 0],
    [w * 0.505, h * 0.58, 0, Math.PI * 0.5],
    [-w * 0.505, h * 0.58, 0, -Math.PI * 0.5]
  ];
  winPositions.forEach(([wx, wy, wz, ry]) => {
    const win = new THREE.Mesh(winGeo, MAT.glowWhite);
    win.position.set(wx, wy, wz);
    win.rotation.y = ry;
    // Crossbar mullion
    const barH = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.018, 0.01), MAT.darkInk);
    const barV = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.17, 0.01), MAT.darkInk);
    win.add(barH, barV);
    g.add(win);
  });

  // Front arched/rectangular door
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.24, 0.02), MAT.darkInk);
  door.position.set(w * 0.16, 0.12, d * 0.5);
  g.add(door);

  // Register animated chimney smoke puffs
  if (smokeList) {
    const puffs = [];
    for (let i = 0; i < 4; i++) {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 10), MAT.smoke);
      addOutline(puff, 0.012);
      g.add(puff);
      puffs.push({
        mesh: puff,
        phase: i * 0.25 + rand() * 0.2,
        origin: new THREE.Vector3(chimX, h + roofH * 0.85, chimZ)
      });
    }
    smokeList.push(...puffs);
  }

  g.scale.setScalar(scale);
  return g;
}

function buildGeometricTree(height = 1.0, style = 'classic') {
  const g = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(height * 0.05, height * 0.075, height * 0.22, 8),
    MAT.darkInk
  );
  trunk.position.y = height * 0.11;
  g.add(trunk);

  if (style === 'classic') {
    const tiers = 3;
    for (let i = 0; i < tiers; i++) {
      const r = height * (0.34 - i * 0.08);
      const h = height * (0.40 - i * 0.05);
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(r, h, 10),
        i % 2 === 0 ? MAT.snow : MAT.midWall
      );
      cone.position.y = height * (0.28 + i * 0.22);
      addOutline(cone, height * 0.022);
      g.add(cone);

      // Tiny geometric silver ornaments on tier rim
      for (let j = 0; j < 4; j++) {
        const a = (j / 4) * Math.PI * 2 + i * 0.7;
        const orb = new THREE.Mesh(
          new THREE.SphereGeometry(height * 0.032, 8, 8),
          j % 2 === 0 ? MAT.glowWhite : MAT.silver
        );
        orb.position.set(
          Math.cos(a) * r * 0.85,
          cone.position.y - h * 0.38,
          Math.sin(a) * r * 0.85
        );
        g.add(orb);
      }
    }
  } else {
    // Concentric Pop-Art geometric rings & floating cones
    for (let i = 0; i < 4; i++) {
      const r = height * (0.38 - i * 0.075);
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, height * 0.024, 8, 24),
        i % 2 === 0 ? MAT.snow : MAT.striped
      );
      ring.rotation.x = Math.PI * 0.5;
      ring.position.y = height * (0.24 + i * 0.19);
      addOutline(ring, height * 0.015);
      g.add(ring);

      const innerCone = new THREE.Mesh(
        new THREE.ConeGeometry(r * 0.62, height * 0.16, 6),
        i % 2 === 0 ? MAT.concentric : MAT.charcoalWall
      );
      innerCone.position.y = ring.position.y + height * 0.04;
      addOutline(innerCone, height * 0.015);
      g.add(innerCone);
    }
  }

  // Star topper
  const star = new THREE.Mesh(new THREE.OctahedronGeometry(height * 0.075, 0), MAT.glowWhite);
  star.position.y = height * 1.02;
  g.add(star);

  return g;
}

function buildToyTrain(trackRadius = 2.6, numCars = 3, verticalHelix = false) {
  const root = new THREE.Group();

  // Build track
  if (!verticalHelix) {
    const railOuter = new THREE.Mesh(
      new THREE.TorusGeometry(trackRadius + 0.07, 0.018, 6, 64),
      MAT.silver
    );
    railOuter.rotation.x = Math.PI * 0.5;
    const railInner = new THREE.Mesh(
      new THREE.TorusGeometry(trackRadius - 0.07, 0.018, 6, 64),
      MAT.silver
    );
    railInner.rotation.x = Math.PI * 0.5;
    root.add(railOuter, railInner);

    // Instanced sleepers
    const count = 48;
    const sleeperGeo = new THREE.BoxGeometry(0.24, 0.02, 0.055);
    const sleepers = new THREE.InstancedMesh(sleeperGeo, MAT.darkInk, count);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      dummy.position.set(Math.cos(a) * trackRadius, -0.01, Math.sin(a) * trackRadius);
      dummy.rotation.set(0, -a, 0);
      dummy.updateMatrix();
      sleepers.setMatrixAt(i, dummy.matrix);
    }
    root.add(sleepers);
  } else {
    // Impossible vertical twisted figure-8 / helical closed loop track
    const pts = [];
    const N = 80;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      pts.push(new THREE.Vector3(
        Math.sin(a) * trackRadius * 0.85,
        Math.sin(a * 2.0) * trackRadius * 0.95 + Math.cos(a) * trackRadius * 0.55,
        Math.cos(a) * trackRadius * 0.65
      ));
    }
    const curve = new THREE.CatmullRomCurve3(pts, true);
    const tubeGeo = new THREE.TubeGeometry(curve, 120, 0.032, 8, true);
    const trackMesh = new THREE.Mesh(tubeGeo, MAT.striped);
    addOutline(trackMesh, 0.02);
    root.add(trackMesh);
    root.userData.curve = curve;
  }

  // Locomotive + carriages
  const units = [];
  const loco = new THREE.Group();
  const boiler = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.36, 12), MAT.charcoalWall);
  boiler.rotation.x = Math.PI * 0.5;
  boiler.position.set(0, 0.14, 0.06);
  addOutline(boiler, 0.018);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.28, 0.20), MAT.striped);
  cab.position.set(0, 0.18, -0.18);
  addOutline(cab, 0.018, true);
  const stack = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.032, 0.16, 10), MAT.darkInk);
  stack.position.set(0, 0.28, 0.16);
  const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), MAT.glowWhite);
  headlight.position.set(0, 0.18, 0.25);
  const cow = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.14, 4), MAT.silver);
  cow.rotation.x = Math.PI * 0.5;
  cow.position.set(0, 0.07, 0.28);
  loco.add(boiler, cab, stack, headlight, cow);

  // Train smoke puffs
  const locoSmoke = [];
  for (let i = 0; i < 4; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), MAT.smoke);
    loco.add(p);
    locoSmoke.push(p);
  }
  root.add(loco);
  units.push({ mesh: loco, offset: 0, smoke: locoSmoke });

  for (let c = 1; c <= numCars; c++) {
    const car = new THREE.Group();
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.21, 0.21, 0.32),
      c % 2 === 1 ? MAT.midWall : MAT.charcoalWall
    );
    box.position.y = 0.14;
    addOutline(box, 0.016, true);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(0.23, 0.04, 0.34), MAT.snow);
    roof.position.y = 0.26;
    const winL = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.07), MAT.glowWhite);
    winL.position.set(0.107, 0.15, 0);
    winL.rotation.y = Math.PI * 0.5;
    const winR = winL.clone();
    winR.position.x = -0.107;
    winR.rotation.y = -Math.PI * 0.5;
    car.add(box, roof, winL, winR);
    root.add(car);
    units.push({ mesh: car, offset: c * 0.42 });
  }

  return {
    root,
    update(time, speed = 0.45) {
      if (!verticalHelix) {
        units.forEach((u) => {
          const theta = time * speed - (u.offset / trackRadius);
          u.mesh.position.set(
            Math.cos(theta) * trackRadius,
            0.02,
            Math.sin(theta) * trackRadius
          );
          // Tangent forward along increasing theta: (-sin, 0, cos)
          u.mesh.rotation.set(0, -theta, 0);
          if (u.smoke) {
            u.smoke.forEach((p, idx) => {
              const ph = (time * 1.4 + idx * 0.25) % 1.0;
              p.position.set(0, 0.36 + ph * 0.45, 0.16 - ph * 0.32);
              p.scale.setScalar(0.5 + ph * 1.1 * (1.0 - ph * 0.5));
              p.visible = ph < 0.92;
            });
          }
        });
      } else {
        const curve = root.userData.curve;
        const up = new THREE.Vector3(0, 1, 0);
        units.forEach((u) => {
          const t = ((time * speed * 0.16 - u.offset * 0.032) % 1.0 + 1.0) % 1.0;
          const pos = curve.getPointAt(t);
          const tan = curve.getTangentAt(t);
          u.mesh.position.copy(pos);
          const lookTarget = pos.clone().add(tan);
          u.mesh.up.copy(up);
          u.mesh.lookAt(lookTarget);
          if (u.smoke) {
            u.smoke.forEach((p, idx) => {
              const ph = (time * 1.5 + idx * 0.25) % 1.0;
              p.position.set(0, 0.35 + ph * 0.4, 0.16 - ph * 0.25);
              p.scale.setScalar(0.45 + ph * 0.9);
            });
          }
        });
      }
    }
  };
}

function buildSantaAndReindeer(formation = 'classic') {
  const group = new THREE.Group();

  // Sleigh + Santa Claus
  const sleigh = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.16, 0.46), MAT.charcoalWall);
  hull.position.y = 0.12;
  addOutline(hull, 0.018, true);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.04, 0.48), MAT.snow);
  trim.position.y = 0.21;
  [-0.14, 0.14].forEach((rx) => {
    const runner = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.03, 0.62), MAT.silver);
    runner.position.set(rx, 0.02, 0.02);
    sleigh.add(runner);
  });
  // Santa silhouette
  const santaTorso = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.24, 10), MAT.darkInk);
  santaTorso.position.set(0, 0.28, 0.02);
  addOutline(santaTorso, 0.014);
  const santaHead = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 10), MAT.snow);
  santaHead.position.set(0, 0.42, 0.02);
  const santaHat = new THREE.Mesh(new THREE.ConeGeometry(0.062, 0.14, 8), MAT.striped);
  santaHat.position.set(0, 0.50, 0.01);
  santaHat.rotation.x = -0.25;
  const pom = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 6), MAT.glowWhite);
  pom.position.set(0, 0.57, -0.02);
  const sack = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), MAT.midWall);
  sack.position.set(0, 0.24, -0.14);
  sleigh.add(hull, trim, santaTorso, santaHead, santaHat, pom, sack);
  group.add(sleigh);

  // Reindeer
  const reindeer = [];
  if (formation === 'classic') {
    for (let i = 0; i < 6; i++) {
      const r = buildReindeer(0.95);
      const row = Math.floor(i / 2);
      const side = i % 2 === 0 ? -0.22 : 0.22;
      r.position.set(side, Math.sin(row * 0.7) * 0.08, 0.65 + row * 0.52);
      group.add(r);
      reindeer.push(r);
    }
  } else {
    // Perfect geometric V / diamond formation
    const offsets = [
      [0, 0, 1.55],
      [-0.42, 0.16, 1.15],
      [0.42, 0.16, 1.15],
      [-0.84, 0.32, 0.75],
      [0, -0.25, 0.85],
      [0.84, 0.32, 0.75],
      [-0.42, -0.16, 0.45],
      [0.42, -0.16, 0.45]
    ];
    offsets.forEach(([ox, oy, oz]) => {
      const r = buildReindeer(0.9);
      r.position.set(ox, oy, oz);
      group.add(r);
      reindeer.push(r);
    });
  }

  // Sparkling geometric star trail
  const stars = [];
  for (let i = 0; i < 10; i++) {
    const st = new THREE.Mesh(new THREE.OctahedronGeometry(0.045, 0), MAT.glowWhite);
    group.add(st);
    stars.push(st);
  }

  return {
    group,
    update(time, orbitRadius = 8.0, speed = 0.28, height = 2.4, tilt = 0.18) {
      const a = time * speed;
      const x = Math.cos(a) * orbitRadius;
      const z = Math.sin(a) * orbitRadius;
      const y = height + Math.sin(a * 2.0) * 0.75;
      group.position.set(x, y, z);

      // Face tangent direction
      const nx = Math.cos(a + 0.05) * orbitRadius;
      const nz = Math.sin(a + 0.05) * orbitRadius;
      const ny = height + Math.sin((a + 0.05) * 2.0) * 0.75;
      group.lookAt(nx, ny, nz);
      group.rotateZ(tilt);

      reindeer.forEach((r, idx) => {
        const gallop = Math.sin(time * 7.5 + idx * 0.65);
        r.rotation.x = gallop * 0.14;
        if (formation === 'classic') {
          r.position.y += gallop * 0.002;
        }
      });

      stars.forEach((st, idx) => {
        const phase = (time * 1.2 + idx * 0.1) % 1.0;
        st.position.set(
          Math.sin(idx * 2.1) * 0.18,
          Math.cos(idx * 1.7) * 0.12,
          -0.4 - phase * 2.2
        );
        const s = (1.0 - phase) * 1.1;
        st.scale.setScalar(s);
        st.rotation.y = time * 2.0 + idx;
      });
    }
  };
}

function buildSnowIsland(radius = 3.2, depth = 1.4) {
  const g = new THREE.Group();
  const domeGeo = new THREE.SphereGeometry(radius, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.5);
  domeGeo.scale(1, 0.22, 1);
  const top = new THREE.Mesh(domeGeo, MAT.snow);
  addOutline(top, 0.045);
  g.add(top);

  const underGeo = new THREE.ConeGeometry(radius * 0.99, depth, 24);
  underGeo.rotateX(Math.PI);
  const under = new THREE.Mesh(underGeo, MAT.charcoalWall);
  under.position.y = -depth * 0.5;
  addOutline(under, 0.045);
  g.add(under);

  return g;
}

function buildSnowfieldInstanced(count = 420, spreadRadius = 14.0, seed = 42) {
  const rand = seededRandom(seed);
  const geo = new THREE.OctahedronGeometry(0.055, 0);
  const inst = new THREE.InstancedMesh(geo, MAT.glowWhite, count);

  const data = [];
  const dummy = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const r = 1.8 + rand() * spreadRadius;
    const theta = rand() * Math.PI * 2;
    const y = (rand() - 0.5) * spreadRadius * 1.4;
    const speed = 0.25 + rand() * 0.55;
    const scale = 0.45 + rand() * 1.2;
    data.push({
      x: Math.cos(theta) * r,
      y,
      z: Math.sin(theta) * r,
      speed,
      scale,
      phase: rand() * Math.PI * 2,
      drift: (rand() - 0.5) * 0.4
    });
    dummy.position.set(data[i].x, data[i].y, data[i].z);
    dummy.scale.setScalar(scale);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }

  return {
    mesh: inst,
    update(time, dt, inverted = false) {
      const bound = spreadRadius * 0.72;
      const dir = inverted ? 1 : -1;
      for (let i = 0; i < count; i++) {
        const d = data[i];
        d.y += dir * d.speed * dt;
        if (d.y < -bound) d.y = bound;
        if (d.y > bound) d.y = -bound;
        dummy.position.set(
          d.x + Math.sin(time * 0.6 + d.phase) * 0.25,
          d.y,
          d.z + Math.cos(time * 0.5 + d.phase) * 0.25
        );
        dummy.rotation.set(time * 0.8 + d.phase, time * 1.1, 0);
        dummy.scale.setScalar(d.scale);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
      }
      inst.instanceMatrix.needsUpdate = true;
    }
  };
}

        );

        s.mesh.scale.setScalar(sc);
      });

      targetBauble.group.rotation.y = Math.sin(time * 0.18) * 0.4 + time * 0.06;
      targetBauble.sphereMat.uniforms.uWarpStrength.value = 0.15 + Math.min(cycleLevel * 0.12, 0.55);

      sideBauble1.group.position.y = 3.6 + Math.sin(time * 0.7) * 0.25;

    }
  };
}

// VOID EXTERIOR SCENE (THE SOLITARY HERO BAUBLE IN EMPTY BLACKNESS)
// ============================================================================
function createVoidScene(envMap) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const heroBauble = createBaubleAssembly(2.0, envMap, {
    longThread: true,
    geometricWarp: 0.0,
    fogDensity: 0.0
  });
  scene.add(heroBauble.group);

  // Subtle drifting monochromatic dust / distant snowflakes around the bauble
  const dustCount = 150;
  const dustGeo = new THREE.OctahedronGeometry(0.022, 0);
  const dustMat = createPopArtMaterial({ baseTone: 0.85, emissive: 0.75 });
  const dust = new THREE.InstancedMesh(dustGeo, dustMat, dustCount);
  const rand = seededRandom(999);
  const dustData = [];
  const dummy = new THREE.Object3D();

  for (let i = 0; i < dustCount; i++) {
    const r = 3.2 + rand() * 8.5;
    const theta = rand() * Math.PI * 2;
    const phi = Math.acos(2 * rand() - 1);
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.cos(phi);
    const z = r * Math.sin(phi) * Math.sin(theta);
    const sc = 0.4 + rand() * 1.1;
    dustData.push({ x, y, z, sc, speed: 0.08 + rand() * 0.16, phase: rand() * Math.PI * 2 });
    dummy.position.set(x, y, z);
    dummy.scale.setScalar(sc);
    dummy.updateMatrix();
    dust.setMatrixAt(i, dummy.matrix);
  }
  scene.add(dust);

  return {
    scene,
    heroBauble,
    update(time, dt) {
      // Imperceptibly slow rotation occasionally reversing slightly
      heroBauble.group.rotation.y = time * 0.035 + Math.sin(time * 0.11) * 0.22;

      for (let i = 0; i < dustCount; i++) {
        const d = dustData[i];
        d.y -= d.speed * dt;
        if (d.y < -7.5) d.y = 7.5;
        dummy.position.set(
          d.x + Math.sin(time * 0.35 + d.phase) * 0.18,
          d.y,
          d.z + Math.cos(time * 0.3 + d.phase) * 0.18
        );
        dummy.rotation.set(time * 0.4 + d.phase, time * 0.5, 0);
        dummy.scale.setScalar(d.sc);
        dummy.updateMatrix();
        dust.setMatrixAt(i, dummy.matrix);
      }
      dust.instanceMatrix.needsUpdate = true;
    }
  };
}

const world0 = buildWorld0Internal(cubeRT1.texture);

// ============================================================================
// CINEMATIC JOURNEY STATE MACHINE (SEAMLESS INFINITE RECURSION)
// ============================================================================
let state = 'EXTERIOR'; // 'EXTERIOR' -> 'INTERIOR' (loops endlessly deeper)
let extTime = 0;
const EXT_DURATION = 34.0;

let activeWorldIdx = 0;
let depthLevel = 0;
let intTime = 0;
const INT_DURATION = 26.0;

let flightCurve = null;
let lookCurve = null;
let approachStartPos = new THREE.Vector3();
let entryForwardDir = new THREE.Vector3(0, 0, -1);

function enterWorld(worldIdx, forwardDir) {
  activeWorldIdx = worldIdx;
  intTime = 0;
  entryForwardDir.copy(forwardDir).normalize();

  const w = worlds[worldIdx];

  // Apply subtle surreal mutation on deeper cycles so infinity never feels static
  if (depthLevel > 0) {
    const twistAngle = (depthLevel * 0.55) % (Math.PI * 2);
    w.scene.rotation.y = twistAngle;
  }

  // Compute target bauble's live world position
  w.targetBauble.group.updateMatrixWorld(true);
  const targetPos = new THREE.Vector3();
  w.targetBauble.group.getWorldPosition(targetPos);

  // Safe approach start right in front of targetBauble (facing toward origin)
  const dirFromCenter = targetPos.clone().normalize();
  const rB = w.targetBauble.radius;
  approachStartPos.copy(targetPos).sub(dirFromCenter.clone().multiplyScalar(rB * 3.4));

  // Build C1-continuous safe flight spline inside the open central corridor
  const p0 = new THREE.Vector3(0, 0, 0);
  const p1 = entryForwardDir.clone().multiplyScalar(2.4);
  const sideAxis = new THREE.Vector3().crossVectors(entryForwardDir, new THREE.Vector3(0, 1, 0)).normalize();
  if (sideAxis.lengthSq() < 0.01) sideAxis.set(1, 0, 0);
  const p2 = entryForwardDir.clone().multiplyScalar(3.5).add(sideAxis.multiplyScalar(1.2));

  // Transform world scenic points by scene rotation
  const rotMat = new THREE.Matrix4().makeRotationY(w.scene.rotation.y);
  const pts = [p0, p1, p2];
  w.scenicPoints.forEach((sp) => {
    pts.push(sp.clone().applyMatrix4(rotMat));
  });
  pts.push(approachStartPos.clone());
  flightCurve = new THREE.CatmullRomCurve3(pts);

  const lPts = [entryForwardDir.clone().multiplyScalar(10.0)];
  w.scenicLooks.forEach((sl) => {
    lPts.push(sl.clone().applyMatrix4(rotMat));
  });
  lPts.push(targetPos.clone());
  lookCurve = new THREE.CatmullRomCurve3(lPts);
}

  const h = window.innerHeight;

  sharedUniforms.uResolution.value.copy(drawingSize);

  portalScreenRT.setSize(drawingSize.x, drawingSize.y);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  portalCam.aspect = w / h;
  portalCam.updateProjectionMatrix();
});

// ============================================================================
// MAIN ANIMATION LOOP
// ============================================================================
const clock = new THREE.Clock();
let frameCount = 0;
const tmpPos = new THREE.Vector3();
const tmpLook = new THREE.Vector3();
const tmpTargetWorld = new THREE.Vector3();
const tmpQuat = new THREE.Quaternion();
const tmpMat = new THREE.Matrix4();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;
  sharedUniforms.uTime.value = elapsed;
  frameCount++;

  // 1. Update all 3 interior worlds so nested reflections stay continuously animated
  for (let i = 0; i < worlds.length; i++) {
    worlds[i].update(elapsed, dt, depthLevel);
    worlds[i].targetBauble.sphereMat.uniforms.uPortalProgress.value = 0.0;
  }

  // 2. Update CubeRenderTargets smartly:
  //    Always update the primarily viewed world's CubeRT every frame;
  //    Round-robin update the next deeper recursive CubeRT every other frame!
  const primaryCubeIdx = state === 'EXTERIOR' ? 0 : (activeWorldIdx + 1) % 3;
  const secondaryCubeIdx = (primaryCubeIdx + 1) % 3;

  worlds[primaryCubeIdx].cubeCam.update(renderer, worlds[primaryCubeIdx].scene);
  if (frameCount % 2 === 0) {
    worlds[secondaryCubeIdx].cubeCam.update(renderer, worlds[secondaryCubeIdx].scene);
  } else {
    const tertiaryCubeIdx = (primaryCubeIdx + 2) % 3;
    worlds[tertiaryCubeIdx].cubeCam.update(renderer, worlds[tertiaryCubeIdx].scene);
  }

  // 3. Camera choreography & seamless optical portal rendering
  let portalProgress = 0.0;

  if (state === 'EXTERIOR') {
    voidScene.update(elapsed, dt);
    extTime += dt;
    const t = Math.min(extTime / EXT_DURATION, 1.0);

    // Wide contemplative pause -> gradual approach -> close orbit -> smooth dive
    let dist, angle, elev;
    if (t < 0.20) {
      const k = easeInOutSine(t / 0.20);
      dist = 8.6 - k * 0.55;
      angle = k * 0.08;
      elev = 0.35 - k * 0.05;
    } else if (t < 0.58) {
      const k = easeInOutCubic((t - 0.20) / 0.38);
      dist = 8.05 - k * 4.35; // 8.05 -> 3.70
      angle = 0.08 + k * 0.72;
      elev = 0.30 - k * 0.45;
    } else if (t < 0.80) {
      const k = easeInOutSine((t - 0.58) / 0.22);
      dist = 3.70 - k * 0.92; // 3.70 -> 2.78 (close inspection of halftone & nested baubles)
      angle = 0.80 + k * 0.58;
      elev = -0.15 + k * 0.28;
    } else {
      const k = easeInOutCubic((t - 0.80) / 0.20);
      dist = 2.78 - k * 0.64; // 2.78 -> 2.14 (fills 100% of screen without clipping surface R=2.0)
      angle = 1.38 + k * 0.14;
      elev = 0.13 * (1.0 - k);
    }

    // Subtle organic camera breathing drift (fades out cleanly before portal entry)
    const swayFade = 1.0 - smoothstep(0.75, 0.92, t);
    const swayX = Math.sin(elapsed * 0.24) * 0.18 * swayFade;
    const swayY = Math.cos(elapsed * 0.19) * 0.10 * swayFade;

    camera.position.set(
      Math.sin(angle) * dist + swayX,
      elev + swayY,
      Math.cos(angle) * dist
    );
    camera.lookAt(0, 0, 0);

    // Update hero bauble shader uniforms
    const heroMat = voidScene.heroBauble.sphereMat;
    heroMat.uniforms.uCamDist.value = camera.position.length();
    heroMat.uniforms.uWarpStrength.value = smoothstep(5.5, 2.5, camera.position.length()) * 0.32;

    if (t > 0.84) {
      portalProgress = smoothstep(0.84, 1.0, t);
      heroMat.uniforms.uPortalProgress.value = portalProgress;

      // Render World 0 from (0,0,0) matching exact camera orientation for zero-seam entry
      portalCam.position.set(0, 0, 0);
      portalCam.quaternion.copy(camera.quaternion);
      renderer.setRenderTarget(portalScreenRT);
      renderer.clear();
      renderer.render(world0.scene, portalCam);
      renderer.setRenderTarget(null);
    } else {
      heroMat.uniforms.uPortalProgress.value = 0.0;
    }

    renderer.render(voidScene.scene, camera);

    if (t >= 1.0) {
      state = 'INTERIOR';
      const fwd = new THREE.Vector3();
      camera.getWorldDirection(fwd);
      enterWorld(0, fwd);
    }
  } else {
    // INTERIOR STATE
    const w = worlds[activeWorldIdx];
    const nextIdx = (activeWorldIdx + 1) % 3;
    const nextW = worlds[nextIdx];

    intTime += dt;
    const u = Math.min(intTime / INT_DURATION, 1.0);

    w.targetBauble.group.updateMatrixWorld(true);
    w.targetBauble.group.getWorldPosition(tmpTargetWorld);
    const rB = w.targetBauble.radius;

    if (u < 0.78) {
      const k = u / 0.78;
      // Smooth slight ease at both ends of spline
      const ek = k * k * (3.0 - 2.0 * k) * 0.25 + k * 0.75;
      flightCurve.getPoint(ek, tmpPos);
      lookCurve.getPoint(ek, tmpLook);

      // Blend look direction smoothly from initial entryForward at u=0
      if (u < 0.16) {
        const blend = smoothstep(0.0, 0.16, u);
        const entryLook = tmpPos.clone().add(entryForwardDir.clone().multiplyScalar(10.0));
        tmpLook.lerpVectors(entryLook, tmpLook, blend);
      }

      // Gently pre-lock look onto targetBauble as we finish the scenic sweep
      if (u > 0.64) {
        const lockBlend = smoothstep(0.64, 0.78, u);
        tmpLook.lerp(tmpTargetWorld, lockBlend);
      }

      camera.position.copy(tmpPos);
      tmpMat.lookAt(camera.position, tmpLook, camera.up);
      tmpQuat.setFromRotationMatrix(tmpMat);
      if (u < 0.05) {
        camera.quaternion.slerp(tmpQuat, 0.25);
      } else {
        camera.quaternion.slerp(tmpQuat, 1.0 - Math.exp(-4.5 * dt));
      }
    } else {
      // Smooth final approach directly into the nested Target Bauble
      const k = easeInOutCubic((u - 0.78) / 0.22);
      const startVec = approachStartPos.clone().sub(tmpTargetWorld);
      const dir = startVec.clone().normalize();
      const startDist = startVec.length();
      const endDist = rB * 1.075; // Fills 100% of screen safely outside sphere surface
      const curDist = THREE.MathUtils.lerp(startDist, endDist, k);

      camera.position.copy(tmpTargetWorld).addScaledVector(dir, curDist);
      tmpMat.lookAt(camera.position, tmpTargetWorld, camera.up);
      tmpQuat.setFromRotationMatrix(tmpMat);
      camera.quaternion.slerp(tmpQuat, 1.0 - Math.exp(-8.0 * dt));
    }

    const camDistToTarget = camera.position.distanceTo(tmpTargetWorld);
    const targetMat = w.targetBauble.sphereMat;
    targetMat.uniforms.uCamDist.value = camDistToTarget;

    if (u > 0.85) {
      portalProgress = smoothstep(0.85, 1.0, u);
      targetMat.uniforms.uPortalProgress.value = portalProgress;

      portalCam.position.set(0, 0, 0);
      portalCam.quaternion.copy(camera.quaternion);
      renderer.setRenderTarget(portalScreenRT);
      renderer.clear();
      renderer.render(nextW.scene, portalCam);
      renderer.setRenderTarget(null);
    } else {
      targetMat.uniforms.uPortalProgress.value = 0.0;
    }

    renderer.render(w.scene, camera);

    if (u >= 1.0) {
      depthLevel++;
      const fwd = new THREE.Vector3();
      camera.getWorldDirection(fwd);
      enterWorld(nextIdx, fwd);
    }
  }
}

animate();
</script>
