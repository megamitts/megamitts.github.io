<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>NIDUS - The Feeding Pit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #game{position:fixed;inset:0;background:#000}
  #game canvas{image-rendering:pixelated;image-rendering:crisp-edges;filter:saturate(1.15) contrast(1.05)}
  /* CRT overlay: scanlines, vignette, occasional phosphor flicker */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.20) 3px),
      radial-gradient(ellipse at center,rgba(60,255,120,.04) 0,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%);
    animation:flick 6s infinite}
  @keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.78}93%{opacity:.97}95%{opacity:.84}97%{opacity:1}}
  #err{position:fixed;left:0;right:0;top:40%;text-align:center;color:#7dff3a;font:16px monospace;z-index:9;display:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="crt"></div>
<div id="err">Phaser 3 could not be loaded from the CDN. Please check your internet connection and reload.</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
'use strict';
/* ==========================================================================
   NIDUS - THE FEEDING PIT
   An original horror sci-fi pixel pinball game. One file, Phaser 3 + custom physics.

   CONTROLS
     Z / Left Arrow     left flipper        M / Right Arrow   right flipper
     Enter / Down Arrow launch ball         Space             nudge (3 per ball, 4th = TILT)
     Q mute   - / =  volume                 `  (backquote)    developer debug overlay
   ========================================================================== */

/* ---------------------------------------------------------------- AUDIO --- */
const SFX = {
  ctx:null, master:null, vol:0.7, muted:false, last:{}, drone:null,
  gap:{hitRail:45,bumper:25,bumperBig:25,spinner:30,blip:30,flipper:20,flipHit:35,roll:120,sling:40,target:30},
  init(){
  MUSIC.start();
  if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:this.vol;
      const comp=this.ctx.createDynamicsCompressor(); this.master.connect(comp); comp.connect(this.ctx.destination);
      const len=this.ctx.sampleRate, buf=this.ctx.createBuffer(1,len,len), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noiseBuf=buf;
    }catch(e){ this.ctx=null; }
  },
  setVol(v){ this.vol=Math.max(0,Math.min(1,v)); if(this.master) this.master.gain.value=this.muted?0:this.vol; },
  toggleMute(){ this.muted=!this.muted; if(this.master) this.master.gain.value=this.muted?0:this.vol; MUSIC.syncMute(); },
  tone(o){
    const c=this.ctx; if(!c) return;
    const t0=c.currentTime+(o.delay||0), osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'square'; osc.frequency.setValueAtTime(o.f,t0);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t0+o.dur);
    const v=(o.vol===undefined?0.2:o.vol);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+(o.att||0.004));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
    osc.connect(g); let out=g;
    if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; g.connect(f); out=f; }
    out.connect(this.master); osc.start(t0); osc.stop(t0+o.dur+0.03);
  },
  noise(o){
    const c=this.ctx; if(!c) return;
    const t0=c.currentTime+(o.delay||0), src=c.createBufferSource();
    src.buffer=this.noiseBuf; src.loop=true;
    const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t0);
    if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+o.dur);
    f.Q.value=o.q||1;
    const g=c.createGain(); g.gain.setValueAtTime(o.vol||0.2,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t0); src.stop(t0+o.dur+0.03);
  },
  play(name,p){
    if(!this.ctx||this.muted) return; p=p||1;
    const now=performance.now(), gap=this.gap[name]||0;
    if(now-(this.last[name]||0)<gap) return; this.last[name]=now;
    const fn=this.snd[name]; if(fn) fn.call(this,p);
  },
  startDrone(){
    if(!this.ctx||this.drone) return; const c=this.ctx;
    const g=c.createGain(); g.gain.value=0.05;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=240;
    const o1=c.createOscillator(), o2=c.createOscillator(), lfo=c.createOscillator(), lg=c.createGain();
    o1.type='sawtooth'; o2.type='sawtooth'; o1.frequency.value=46; o2.frequency.value=46.7;
    lfo.frequency.value=0.18; lg.gain.value=90; lfo.connect(lg); lg.connect(f.frequency);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    [o1,o2,lfo].forEach(o=>o.start()); this.drone={g,nodes:[o1,o2,lfo]};
  },
  stopDrone(){
    if(!this.drone) return; const d=this.drone; this.drone=null;
    d.g.gain.setTargetAtTime(0.0001,this.ctx.currentTime,0.3);
    setTimeout(()=>d.nodes.forEach(n=>{try{n.stop();}catch(e){}}),1500);
  },
  snd:{
    launch(){ this.noise({dur:.35,vol:.25,type:'lowpass',f:300,f2:2500,q:.7}); this.tone({f:70,f2:420,dur:.3,type:'sawtooth',vol:.18,lp:1800}); },
    charge(){ this.tone({f:50,f2:180,dur:.24,type:'sawtooth',vol:.12,lp:600}); this.noise({dur:.24,vol:.06,f:400,f2:1200,q:2}); },
    rail(){ this.noise({dur:.3,vol:.1,f:1800,f2:700,q:1.5}); this.tone({f:300,f2:200,dur:.3,type:'triangle',vol:.05}); },
    roll(){ this.noise({dur:.14,vol:.05,f:1300,f2:900,q:2}); },
    hitRail(p){ this.tone({f:1100*p,f2:600*p,dur:.05,type:'triangle',vol:.07}); },
    bumper(p){ this.tone({f:420*p,f2:140*p,dur:.13,type:'square',vol:.12,lp:3000}); this.noise({dur:.06,vol:.1,f:2200,q:1.5}); },
    bumperBig(p){ this.tone({f:110*p,f2:40,dur:.3,type:'sine',vol:.35}); this.tone({f:260*p,f2:80,dur:.18,type:'sawtooth',vol:.12,lp:1500}); this.noise({dur:.12,vol:.12,type:'lowpass',f:1200}); },
    flipper(){ this.tone({f:160,f2:70,dur:.07,type:'triangle',vol:.16}); this.noise({dur:.04,vol:.07,type:'highpass',f:1500}); },
    flipHit(p){ this.tone({f:240*p,f2:120,dur:.06,type:'square',vol:.1}); },
    target(p){ this.tone({f:1300*p,f2:1900*p,dur:.08,type:'square',vol:.1}); this.tone({f:650*p,dur:.1,type:'triangle',vol:.08,delay:.02}); },
    creatureHit(p){ this.tone({f:320*p,f2:90,dur:.16,type:'sawtooth',vol:.14,lp:1400}); this.noise({dur:.14,vol:.1,f:700,f2:250,q:3}); },
    creatureDie(){ this.tone({f:420,f2:35,dur:.6,type:'sawtooth',vol:.2,lp:1200}); this.noise({dur:.5,vol:.18,f:1500,f2:150,q:1.5}); this.tone({f:60,dur:.4,type:'sine',vol:.3,delay:.05}); },
    spinner(p){ this.tone({f:700*p,f2:900*p,dur:.03,type:'square',vol:.05}); },
    tunnelIn(){ this.tone({f:700,f2:90,dur:.3,type:'sine',vol:.2}); this.noise({dur:.3,vol:.1,f:2000,f2:300,q:2}); },
    eject(){ this.tone({f:100,f2:520,dur:.2,type:'sawtooth',vol:.15,lp:1500}); this.noise({dur:.15,vol:.12,type:'lowpass',f:3000}); },
    hive(p){ [0,1,2].forEach(i=>this.tone({f:392*p*(1+i*0.25),dur:.08,type:'square',vol:.1,delay:i*.05})); },
    hiveDone(){ for(let i=0;i<8;i++) this.tone({f:260*Math.pow(1.12246,i*2),dur:.12,type:'square',vol:.12,delay:i*.07}); this.noise({dur:.8,vol:.1,type:'lowpass',f:200,f2:2000,delay:.3}); },
    rampDone(){ [440,554,659,880].forEach((f,i)=>this.tone({f,dur:.09,type:'triangle',vol:.14,delay:i*.05})); },
    extraBall(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone({f,dur:.18,type:'triangle',vol:.18,delay:i*.09})); },
    multiball(){ for(let i=0;i<4;i++) this.tone({f:500,f2:1000,dur:.22,type:'sawtooth',vol:.12,delay:i*.25,lp:2500}); this.tone({f:55,dur:1,type:'sine',vol:.3}); },
    saverOn(){ this.tone({f:900,dur:.07,type:'square',vol:.1}); this.tone({f:1200,dur:.07,type:'square',vol:.1,delay:.09}); },
    saved(){ this.tone({f:1400,f2:300,dur:.4,type:'square',vol:.14,lp:2500}); this.tone({f:300,f2:900,dur:.25,type:'triangle',vol:.14,delay:.3}); },
    drain(){ this.tone({f:300,f2:30,dur:.9,type:'sawtooth',vol:.2,lp:900}); this.noise({dur:.7,vol:.15,type:'lowpass',f:900,f2:100}); },
    newBall(){ [330,440,660].forEach((f,i)=>this.tone({f,dur:.07,type:'square',vol:.09,delay:i*.07})); },
    gameOver(){ [392,370,349,330,311,294,277,262].forEach((f,i)=>this.tone({f:f,f2:f*.97,dur:.3,type:'sawtooth',vol:.16,delay:i*.22,lp:1200})); this.tone({f:50,f2:25,dur:2,type:'sine',vol:.3,delay:.2}); },
    highScore(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>this.tone({f,dur:.14,type:'square',vol:.12,delay:i*.1})); },
    nudge(){ for(let i=0;i<3;i++){ this.tone({f:880,dur:.07,type:'square',vol:.16,delay:i*.1}); this.tone({f:660,dur:.07,type:'square',vol:.16,delay:i*.1+.05}); } this.noise({dur:.18,vol:.2,type:'lowpass',f:500,f2:80}); },
    tilt(){ for(let i=0;i<10;i++) this.tone({f:i%2?520:1040,dur:.11,type:'sawtooth',vol:.25,delay:i*.12,lp:3500}); this.noise({dur:1.2,vol:.25,type:'lowpass',f:1500,f2:60}); },
    drop(){ this.noise({dur:.1,vol:.18,type:'lowpass',f:900,f2:200}); this.tone({f:150,f2:55,dur:.12,type:'triangle',vol:.2}); },
    egg(p){ this.tone({f:210*p,f2:60,dur:.2,type:'sine',vol:.25}); this.noise({dur:.18,vol:.14,f:600,f2:180,q:3}); },
    sling(p){ this.tone({f:180*p,f2:520*p,dur:.07,type:'square',vol:.12}); this.noise({dur:.05,vol:.12,type:'highpass',f:2500}); },
    lock(){ this.tone({f:240,f2:90,dur:.2,type:'triangle',vol:.25}); this.noise({dur:.1,vol:.2,f:1400,q:4}); },
    bonusStart(){ this.tone({f:40,f2:30,dur:1.6,type:'sawtooth',vol:.25,lp:300}); this.tone({f:100,f2:1200,dur:1.2,type:'sawtooth',vol:.1,lp:2000,delay:.2}); this.noise({dur:1.2,vol:.15,type:'lowpass',f:200,f2:3000}); },
    wave(){ [440,554,659,880].forEach((f,i)=>this.tone({f,dur:.1,type:'square',vol:.1,delay:i*.06})); },
    blip(p){ this.tone({f:1500*p,dur:.04,type:'square',vol:.07}); },
    squelch(){ this.tone({f:150,f2:400,dur:.2,type:'sine',vol:.2}); this.noise({dur:.2,vol:.1,f:500,f2:1200,q:4}); }
  }
};

/* ---------------------------------------------------------------- MUSIC --- */
const MUSIC={
  el:null, vol:0.45, started:false,
  start(){
    if(this.started) return; this.started=true;
    try{
      this.el=new Audio('music.mp3'); this.el.loop=true; this.el.volume=this.vol; this.el.muted=SFX.muted;
      this.el.play().catch(()=>{ this.started=false; });   // browser blocked autoplay: retry on the next key press
    }catch(e){ this.started=false; }
  },
  setVol(v){ this.vol=Math.max(0,Math.min(1,v)); if(this.el) this.el.volume=this.vol; },
  syncMute(){ if(this.el) this.el.muted=SFX.muted; }
};

//#CORE-BEGIN
/* ============================================================ GAME CORE ===
   Everything below this marker is pure game logic and physics (no Phaser, no DOM),
   so it can be simulated headlessly.
   Table coordinates: x 0..240, y 0..448 (y points DOWN). Canvas is 360x448,
   the extra 120px on the right is the LED scoreboard. */
const W=360, H=448, TW=240, MID=109;
const G=380, MAXV=720, DT=1/240, BR=4;          // gravity px/s^2, max ball speed, fixed physics step, ball radius
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const mirror=x=>218-x;                          // table is mirror-symmetric about x=109

const C={ black:'#05030a', flesh1:'#2b0f2f', flesh2:'#431549', flesh3:'#6a1f5c',
  red1:'#6e0c1c', red2:'#b3182a', red3:'#ff3b2e', orange:'#ff8a1f', yel:'#d6e34a', yel2:'#f6ff7a',
  grn1:'#1d5a12', grn2:'#3fa21a', grn3:'#7dff3a', pur1:'#4b1a7a', pur2:'#8a3cc9', pur3:'#c77dff',
  bone:'#cbb98a', bone2:'#8c7d58', white:'#f4f4ff', steel:'#8a94a8', steel2:'#4c5468' };

const Store={
  get(){ try{ return parseInt(localStorage.getItem('nidus_hi')||'0',10)||0; }catch(e){ return 0; } },
  set(v){ try{ localStorage.setItem('nidus_hi',String(v)); }catch(e){} }
};

/* ---- Static line segment (capsule): walls, rails, standups, sling faces, drop targets ---- */
class Seg{
  constructor(ax,ay,bx,by,o){
    o=o||{};
    this.ax=ax; this.ay=ay; this.bx=bx; this.by=by;
    this.t=o.t||1.5;                             // half thickness
    this.e=o.e===undefined?0.45:o.e;             // restitution
    this.f=o.f===undefined?0.02:o.f;             // tangential friction on contact
    this.oneWay=!!o.oneWay; this.kick=o.kick||0; this.tag=o.tag||'';
    this.target=o.target||null; this.drop=!!o.drop; this.up=true; this.anim=0; this.cd=0;
    const dx=bx-ax, dy=by-ay, l=Math.hypot(dx,dy)||1;
    this.dx=dx; this.dy=dy; this.l2=l*l; this.len=l;
    this.nx=o.nx!==undefined?o.nx:dy/l; this.ny=o.ny!==undefined?o.ny:-dx/l;
  }
}

/* ---- Circular object: bumpers, eyes, eggs, creatures, hatch, bonus aliens ---- */
class Pop{
  constructor(type,x,y,r,o){
    this.type=type; this.x=x; this.y=y; this.r=r;
    this.kick=0; this.score=0; this.e=0.5; this.hp=0; this.hpMax=0; this.alive=true;
    this.flash=0; this.anim=0; this.cd=0; this.color=C.grn3; this.core=false; this.respawn=0;
    if(o) Object.assign(this,o);
  }
}

/* ---- A guided path: ramps (gravity driven) and tubes (constant speed) ---- */
class Rail{
  constructor(name,pts,o){
    this.name=name; this.pts=pts; this.cum=[0];
    for(let i=1;i<pts.length;i++) this.cum.push(this.cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    this.len=this.cum[this.cum.length-1];
    this.tube=false; this.speed=210; this.er=9; this.minDot=100; this.minExit=0; this.minStart=60; this.flash=0;
    if(o) Object.assign(this,o);
  }
  seg(s){ let i=1; while(i<this.cum.length-1&&this.cum[i]<s) i++; return i; }
  pointAt(s){
    s=clamp(s,0,this.len); const i=this.seg(s), a=this.pts[i-1], b=this.pts[i];
    const t=(s-this.cum[i-1])/((this.cum[i]-this.cum[i-1])||1);
    return [lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
  }
  tanAt(s){
    const i=this.seg(clamp(s,0,this.len)), a=this.pts[i-1], b=this.pts[i];
    const l=Math.hypot(b[0]-a[0],b[1]-a[1])||1; return [(b[0]-a[0])/l,(b[1]-a[1])/l];
  }
}

class Ball{
  constructor(x,y){
    this.x=x; this.y=y; this.vx=0; this.vy=0; this.r=BR;
    this.state='play';            // play | rail | locked
    this.rail=null; this.s=0; this.sp=0; this.railT=0; this.cool=0; this.still=0; this.trail=[];
  }
}

/* ---- Flipper: tapered capsule that rotates about a pivot. `a` is the angle parameter;
        world direction = (side*cos a, sin a). Collision uses the surface velocity of the
        moving flipper so the ball is thrown according to where it was struck. ---- */
class Flipper{
  constructor(px,py,side){
    this.px=px; this.py=py; this.side=side; this.len=34; this.r0=5; this.r1=3;
    this.rest=0.55; this.up=-0.28; this.a=this.rest; this.omega=0; this.on=false; this.prevOn=false;
  }
  dirX(){ return this.side*Math.cos(this.a); }
  dirY(){ return Math.sin(this.a); }
  tipX(){ return this.px+this.dirX()*this.len; }
  tipY(){ return this.py+this.dirY()*this.len; }
  update(dt,pressed){
    const tgt=pressed?this.up:this.rest, sp=pressed?14:9, da=tgt-this.a;
    let step=Math.sign(da)*sp*dt; if(Math.abs(step)>=Math.abs(da)) step=da;
    this.a+=step; this.omega=this.side*step/dt;   // world angular velocity (rad/s)
    this.on=pressed;
  }
  collide(b){
    const dx=this.dirX()*this.len, dy=this.dirY()*this.len;
    let t=((b.x-this.px)*dx+(b.y-this.py)*dy)/(this.len*this.len); t=clamp(t,0,1);
    const cx=this.px+dx*t, cy=this.py+dy*t, rr=lerp(this.r0,this.r1,t);
    let nx=b.x-cx, ny=b.y-cy; const d2=nx*nx+ny*ny, R=b.r+rr;
    if(d2>=R*R) return 0;
    let d=Math.sqrt(d2); if(d<1e-5){ nx=0; ny=-1; d=0; } else { nx/=d; ny/=d; }
    b.x+=nx*(R-d); b.y+=ny*(R-d);
    // velocity of the flipper surface at the contact point: omega x r
    const sx=cx+nx*rr-this.px, sy=cy+ny*rr-this.py;
    const svx=-this.omega*sy, svy=this.omega*sx;
    let rvx=b.vx-svx, rvy=b.vy-svy; const vn=rvx*nx+rvy*ny;
    if(vn<0){
      const e=Math.abs(this.omega)>1?0.5:(-vn<40?0:0.25);
      rvx-=(1+e)*vn*nx; rvy-=(1+e)*vn*ny;
      b.vx=svx+rvx; b.vy=svy+rvy;
      return -vn;
    }
    return 0;
  }
}

/* ============================================================== PINBALL === */
class Pinball{
  constructor(demo,input){
    this.demo=!!demo; this.input=input||{left:false,right:false};
    this.hi=Store.get(); this.debug=false; this.acc=0; this.autoT=0;
    this.buildFrame(); this.newGame();
  }
  sfx(n,p){ if(!this.demo) SFX.play(n,p); }

  /* ---------- static geometry shared by every mode ---------- */
  buildFrame(){
    const f=this.frame=[], add=(ax,ay,bx,by,o)=>{ const s=new Seg(ax,ay,bx,by,o); f.push(s); return s; };
    const cx=120, cy=120, R=118, N=32;                      // top arch
    for(let i=0;i<N;i++){
      const a0=Math.PI+Math.PI*i/N, a1=Math.PI+Math.PI*(i+1)/N;
      add(cx+R*Math.cos(a0),cy+R*Math.sin(a0),cx+R*Math.cos(a1),cy+R*Math.sin(a1),{t:2,tag:'arc'});
    }
    add(2,120,2,440,{t:1.5,tag:'wall'});
    add(238,120,238,440,{t:1.5,tag:'wall'});
    add(216,112,216,440,{t:1.5,tag:'lane'});                 // plunger lane inner wall
    add(217,436,238,436,{t:1.5,tag:'floor',e:0});            // plunger lane floor
    add(216,104,234,96,{t:1.2,oneWay:true,nx:-0.406,ny:-0.914,tag:'gate'}); // one-way lane gate
    add(16,300,16,330,{t:1,tag:'guide'}); add(mirror(16),300,mirror(16),330,{t:1,tag:'guide'});
    add(16,330,68,393,{t:1.5,tag:'rail'}); add(mirror(16),330,mirror(68),393,{t:1.5,tag:'rail'});
    // slingshots (kick faces plus body)
    const sl=this.slingSegs=[];
    const sadd=(ax,ay,bx,by,o)=>{ const s=new Seg(ax,ay,bx,by,o); sl.push(s); return s; };
    sadd(30,296,58,346,{t:1.5,e:0.2,kick:190,tag:'sling'});
    sadd(30,296,30,330,{t:1.5,tag:'slingbody'}); sadd(30,330,58,346,{t:1.5,tag:'slingbody'});
    sadd(188,296,160,346,{t:1.5,e:0.2,kick:190,tag:'sling'});
    sadd(188,296,188,330,{t:1.5,tag:'slingbody'}); sadd(188,330,160,346,{t:1.5,tag:'slingbody'});
    this.flips=[new Flipper(71,396,1), new Flipper(147,396,-1)];
  }

  /* ---------- table features (built once per game) ---------- */
  buildTable(){
    this.pops=[
      new Pop('bumper',84,244,8,{kick:235,score:500,color:C.grn3}),
      new Pop('bumper',134,244,8,{kick:235,score:500,color:C.grn3}),
      new Pop('bumper',109,268,8,{kick:235,score:500,color:C.grn3}),
      new Pop('bumper',120,84,13,{kick:260,score:1000,color:C.red3,core:true}),
      new Pop('eye',70,56,6,{kick:200,score:300}),
      new Pop('eye',170,56,6,{kick:200,score:300}),
      new Pop('egg',70,122,7,{hp:3,hpMax:3,e:0.55}),
      new Pop('egg',170,122,7,{hp:3,hpMax:3,e:0.55}),
      new Pop('egg',120,140,7,{hp:3,hpMax:3,e:0.55}),
      new Pop('creature',150,206,6,{hp:4,hpMax:4,e:0.5}),
      new Pop('creature',172,230,6,{hp:4,hpMax:4,e:0.5}),
      new Pop('hatch',120,36,8,{e:0.5})
    ];
    this.hatch=this.pops[this.pops.length-1];
    const tg=this.tsegs=[]; this.targets=[]; this.drops=[];
    const tadd=(ax,ay,bx,by,o)=>{ const s=new Seg(ax,ay,bx,by,o); tg.push(s); return s; };
    // HIVE letter standups: H, I upper walls; V, E lower walls (cross-table play)
    this.targets.push(tadd(4.5,194,4.5,218,{t:1.5,e:0.35,nx:1,ny:0,target:{idx:0},tag:'target'}));
    this.targets.push(tadd(213.5,194,213.5,218,{t:1.5,e:0.35,nx:-1,ny:0,target:{idx:1},tag:'target'}));
    this.targets.push(tadd(4.5,262,4.5,278,{t:1.5,e:0.35,nx:1,ny:0,target:{idx:2},tag:'target'}));
    this.targets.push(tadd(213.5,262,213.5,278,{t:1.5,e:0.35,nx:-1,ny:0,target:{idx:3},tag:'target'}));
    for(const x of [83,109,135]) this.drops.push(tadd(x-6,311,x+6,313,{t:2.2,e:0.4,drop:true,tag:'drop'}));   // slightly tilted so a ball cannot balance on top
    this.rolls=[[9,318],[23,318],[195,318],[209,318]].map(p=>({x:p[0],y:p[1],r:4.5,on:false,cd:0,lit:0}));
    this.spinners=[[23,304],[195,304]].map(p=>({x:p[0],y:p[1],w:12,ang:0,omega:0,last:0,cd:0}));
    this.mouths=[
      {id:'lockA',type:'lock',x:40,y:176,r:7,ball:null,flash:0},
      {id:'lockB',type:'lock',x:178,y:176,r:7,ball:null,flash:0},
      {id:'throat',type:'throat',x:109,y:190,r:7,ball:null,flash:0}
    ];
    this.rampA=new Rail('LEFT ORBIT',[[16,236],[15,200],[15,150],[24,118],[44,98],[62,92]],{er:10,minDot:140,minExit:120});
    this.rampB=new Rail('SPINE',[[200,112],[204,150],[204,226],[194,262],[172,284]],{er:9,minDot:20,minExit:0});
    this.tube=new Rail('GULLET',[[109,190],[70,204],[52,236],[56,270],[80,294]],{tube:true,speed:210});
    this.rails=[this.rampA,this.rampB];
    // bonus chamber furniture
    this.bonusBumpers=[new Pop('bbump',62,230,8,{kick:220,score:200,color:C.pur3}),new Pop('bbump',156,230,8,{kick:220,score:200,color:C.pur3})];
    this.bpops=[]; this.aliens=[]; this.boss=null;
  }

  /* ---------- game / ball lifecycle ---------- */
  newGame(){
    this.score=0; this.ballNo=1; this.ballsMax=3; this.extraQueue=0; this.extrasGiven=0; this.thresholdGiven=false;
    this.hive=[false,false,false,false]; this.hiveFlash=0; this.hiveResetT=0;
    this.time=0; this.parts=[]; this.floats=[]; this.msgQ=[]; this.msg=null; this.big=null;
    this.flashA=0; this.flashCol='#fff'; this.shake=0; this.blackout=0; this.over=false; this.overT=0; this.newHigh=false; this.overBurstT=0;
    this.phase='play'; this.phaseT=0; this.endDelay=2.8;
    this.buildTable(); this.startBall();
  }
  startBall(){
    this.balls=[]; this.nudges=3; this.tilt=false; this.baseMult=1; this.hiveBoost=0; this.combo=0; this.comboT=0;
    this.saver=0; this.saverArmed=true; this.mb=false; this.mbPending=0; this.jackpotLit=false; this.pendingServe=0;
    this.hatchOpen=0; this.mode='main'; this.bonus=null; this.nudgeCd=0; this.dropResetT=0; this.eggResetT=0;
    this.lastRampT=-99; this.lastRamp=null; this.tiltT=0;
    this.stats={targets:0,ramps:0,aliens:0,eggs:0,locks:0};
    this.plunger={state:'idle',t:0,ball:null};
    for(const m of this.mouths){ m.ball=null; m.flash=0; }
    for(const d of this.drops) d.up=true;
    for(const r of this.rolls){ r.on=false; }
    this.bpops=[]; this.aliens=[]; this.boss=null;
    this.phase='play'; this.phaseT=0;
    this.spawnLaneBall(); this.sfx('newBall');
    this.say('BALL '+this.ballNo,'#ffb02e');
  }
  laneOccupied(){ return this.balls.some(b=>b.state==='play'&&b.x>217&&b.y>400); }
  spawnLaneBall(){
    if(this.laneOccupied()){ this.pendingServe++; return; }
    this.balls.push(new Ball(227,428));
  }
  activeCount(){ let n=0; for(const b of this.balls) if(b.state!=='locked') n++; return n; }
  mult(){ return this.baseMult+(this.hiveBoost>0?1:0)+(this.mb?1:0); }

  endBall(){
    this.phase='ending'; this.phaseT=0; this.mbPending=0; this.mb=false; this.pendingServe=0;
    this.balls=[]; this.mode='main'; this.bonus=null; this.bpops=[]; this.aliens=[]; this.boss=null; this.hatchOpen=0;
    for(const m of this.mouths) m.ball=null;
    let bonus=0;
    if(!this.tilt){
      const s=this.stats;
      bonus=(s.targets*100+s.ramps*1000+s.aliens*2500+s.eggs*1000+s.locks*1500)*this.baseMult;
      this.score+=bonus;
      this.say('BALL '+this.ballNo+' BONUS','#ffb02e'); this.say(String(bonus),'#7dff3a');
    }
    this.endDelay=this.tilt?2.4:3.2;
  }
  nextBall(){
    if(this.extraQueue>0){ this.extraQueue--; this.startBall(); this.say('SHOOT AGAIN','#7dff3a'); return; }
    this.ballNo++;
    if(this.ballNo>this.ballsMax) this.gameOver(); else this.startBall();
  }
  gameOver(){
    this.phase='over'; this.over=true; this.overT=0; this.balls=[];
    if(!this.demo){
      if(this.score>this.hi){ this.hi=this.score; this.newHigh=true; Store.set(this.hi); this.sfx('highScore'); }
      else this.sfx('gameOver');
    }
  }

  /* ---------- player actions ---------- */
  launch(){
    if(this.phase!=='play'||this.tilt||this.plunger.state!=='idle') return;
    const b=this.balls.find(q=>q.state==='play'&&q.x>217&&q.y>405&&Math.hypot(q.vx,q.vy)<40);
    if(!b) return;
    this.plunger={state:'charge',t:0,ball:b}; this.sfx('charge');
  }
  nudge(){
    if(this.phase!=='play'||this.tilt||this.nudgeCd>0) return;
    const live=this.balls.filter(b=>b.state==='play'&&!(b.x>217&&b.y>400));
    if(!live.length&&this.mode!=='bonus') return;
    this.nudgeCd=0.3;
    if(this.nudges<=0){ this.doTilt(); return; }
    const strength=[0.6,0.8,1][this.nudges-1]||1;
    this.nudges--;
    for(const b of live){
      const side=b.x<MID?1:-1, k=0.6+0.8*Math.abs(b.x-MID)/MID;   // shove towards the centre, harder near the walls
      b.vx+=side*(80+rnd(0,25))*k*strength; b.vy-=(55+rnd(0,15))*strength;
    }
    this.shake=Math.max(this.shake,0.45); this.sfx('nudge');
    this.say(this.nudges===0?'TILT WARNING':'NUDGE DETECTED',this.nudges===0?'#ff3b2e':'#ffb02e');
  }
  doTilt(){
    this.tilt=true; this.sfx('tilt'); this.flashA=1; this.flashCol='#ff2020'; this.shake=1;
    this.bigMsg('TILT','#ff3b2e',2.2); this.say('TILT','#ff3b2e');
    for(const b of this.balls) this.burst(b.x,b.y,C.red3,12,140);
    this.balls=[]; this.stats={targets:0,ramps:0,aliens:0,eggs:0,locks:0};
    this.endBall();
  }

  /* ---------- messages, particles, scoring ---------- */
  say(text,col){ if(this.msgQ.length>3) this.msgQ.shift(); this.msgQ.push({text,col:col||'#7dff3a',t:0,dur:1.3}); }
  bigMsg(text,col,dur){ this.big={text,col:col||'#fff',t:0,dur:dur||1.6}; }
  burst(x,y,col,n,sp){
    for(let i=0;i<n;i++){ const a=rnd(0,TAU), s=rnd(0.3,1)*sp;
      this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:rnd(0.25,0.6),max:0.6,col}); }
    if(this.parts.length>260) this.parts.splice(0,this.parts.length-260);
  }
  award(pts,x,y,raw){
    const v=pts*(raw?1:this.mult()); this.score+=v;
    if(x!==undefined&&v>=500){ this.floats.push({x,y,t:0,text:String(v)}); if(this.floats.length>12) this.floats.shift(); }
    if(!this.thresholdGiven&&this.score>=150000){ this.thresholdGiven=true; this.awardExtra(); }
    return v;
  }
  registerHit(){
    if(this.comboT>0) this.combo++; else this.combo=1;
    this.comboT=2.2;
    if(this.combo>=3){ this.score+=Math.min(this.combo,8)*100; if(this.combo%3===0&&this.combo<=9) this.say('COMBO X'+this.combo,'#d6e34a'); }   // capped so long chains can't run away
  }
  awardExtra(){
    if(this.extrasGiven>=2){ this.score+=10000; return; }            // cap: two extra balls per game
    this.extrasGiven++; this.extraQueue++; this.bigMsg('EXTRA BALL','#7dff3a',2); this.say('EXTRA BALL','#7dff3a');
    this.sfx('extraBall'); this.flashA=0.6; this.flashCol='#7dff3a';
  }

  /* ---------- fixed-step simulation ---------- */
  update(dt){
    this.time+=dt;
    if(this.demo) this.autoplay(dt);
    if(this.phase==='play'||this.phase==='ending'){
      this.acc+=Math.min(dt,0.05); let n=0;
      while(this.acc>=DT&&n<30){ this.step(DT); this.acc-=DT; n++; }
      if(n>=30) this.acc=0;
    }
    this.timers(dt);
  }
  autoplay(dt){
    const inp=this.input; inp.left=false; inp.right=false;
    if(this.phase==='over'){ if(this.overT>1.5) this.newGame(); return; }
    for(const b of this.balls){
      if(b.state!=='play') continue;
      if(b.x>217&&b.y>405&&Math.hypot(b.vx,b.vy)<40){ this.autoT+=dt; if(this.autoT>0.8){ this.autoT=0; this.launch(); } }
      else if(b.y>360&&b.vy>-80){ if(b.x<MID+3) inp.left=true; if(b.x>MID-3&&b.x<216) inp.right=true; }
    }
  }
  step(dt){
    const live=this.phase==='play'&&!this.tilt;
    for(const f of this.flips){
      const pressed=live&&(f.side>0?this.input.left:this.input.right);
      f.update(dt,pressed); if(pressed&&!f.prevOn) this.sfx('flipper'); f.prevOn=pressed;
    }
    if(this.mode==='bonus') this.stepBonusActors(dt);
    for(const b of this.balls.slice()){
      if(b.state==='play') this.stepBall(b,dt); else if(b.state==='rail') this.stepRail(b,dt);
    }
    const pl=this.balls.filter(b=>b.state==='play');
    for(let i=0;i<pl.length;i++) for(let j=i+1;j<pl.length;j++) this.ballBall(pl[i],pl[j]);
  }
  ballBall(a,b){
    const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy, R=a.r+b.r;
    if(d2>=R*R||d2<1e-6) return;
    const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, pen=(R-d)/2;
    a.x-=nx*pen; a.y-=ny*pen; b.x+=nx*pen; b.y+=ny*pen;
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rv<0){ const j=-(1+0.85)*rv/2; a.vx-=j*nx; a.vy-=j*ny; b.vx+=j*nx; b.vy+=j*ny; this.sfx('hitRail',1.4); }
  }
  stepBall(b,dt){
    if(b.cool>0) b.cool-=dt;
    b.vy+=G*dt; const dmp=1-0.1*dt; b.vx*=dmp; b.vy*=dmp;           // gravity + slight air drag
    const sp=Math.hypot(b.vx,b.vy); if(sp>MAXV){ const k=MAXV/sp; b.vx*=k; b.vy*=k; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    for(const s of this.frame){ const imp=this.hitSeg(b,s); if(imp>140) this.sfx('hitRail',rnd(0.9,1.15)); }
    for(const s of this.slingSegs){ const imp=this.hitSeg(b,s); if(imp>40&&s.kick) this.onSling(s); }
    for(const f of this.flips){ const imp=f.collide(b); if(imp>200) this.sfx('flipHit',rnd(0.9,1.1)); }
    if(this.mode==='main') this.featuresMain(b); else this.featuresBonus(b);
    const sp2=Math.hypot(b.vx,b.vy); if(sp2>MAXV){ const k=MAXV/sp2; b.vx*=k; b.vy*=k; }
    if(b.x<-6||b.x>TW+6||b.y<-30){ b.x=109; b.y=200; b.vx=0; b.vy=50; return; }   // safety net
    if(this.mode==='bonus'){
      if(b.y>428&&b.x<216){ b.y=428; b.vy=-rnd(430,480); b.vx+=rnd(-70,70); this.sfx('eject'); this.burst(b.x,436,C.pur3,8,100); }
    } else if((b.y>441&&b.x<216)||b.y>H+10) this.drainBall(b);
  }

  /* ball vs capsule. Pushes the ball out, reflects velocity, returns impact speed (0 if no impact) */
  hitSeg(b,s){
    let t=((b.x-s.ax)*s.dx+(b.y-s.ay)*s.dy)/s.l2; t=t<0?0:(t>1?1:t);
    const cx=s.ax+s.dx*t, cy=s.ay+s.dy*t; let nx=b.x-cx, ny=b.y-cy;
    const R=b.r+s.t, d2=nx*nx+ny*ny; if(d2>=R*R) return 0;
    let d=Math.sqrt(d2);
    if(d<1e-5){ nx=s.nx; ny=s.ny; d=0; } else { nx/=d; ny/=d; }
    if(s.oneWay&&nx*s.nx+ny*s.ny<=0) return 0;       // ball is on the passable side
    const vn=b.vx*nx+b.vy*ny;
    if(s.oneWay&&vn>=0) return 0;
    b.x+=nx*(R-d); b.y+=ny*(R-d);
    if(vn<0){
      const e=(-vn<30)?0:s.e;
      b.vx-=(1+e)*vn*nx; b.vy-=(1+e)*vn*ny;
      const tx=-ny, ty=nx, vt=b.vx*tx+b.vy*ty; b.vx-=tx*vt*s.f; b.vy-=ty*vt*s.f;
      if(s.kick&&-vn>40){ b.vx+=nx*s.kick; b.vy+=ny*s.kick; }
      return -vn;
    }
    return 0;
  }
  /* ball vs circle. Bumpers (p.kick) actively throw the ball away. */
  hitPop(b,p){
    const dx=b.x-p.x, dy=b.y-p.y, R=b.r+p.r, d2=dx*dx+dy*dy; if(d2>=R*R) return 0;
    let d=Math.sqrt(d2), nx, ny; if(d<1e-5){ nx=0; ny=-1; d=0; } else { nx=dx/d; ny=dy/d; }
    b.x+=nx*(R-d); b.y+=ny*(R-d);
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){
      if(p.kick){
        const sp=Math.hypot(b.vx,b.vy), k=p.kick+Math.min(sp*0.25,90), tv=-b.vx*ny+b.vy*nx;
        b.vx=nx*k-ny*tv*0.4; b.vy=ny*k+nx*tv*0.4;
      } else {
        const e=(-vn<30)?0:p.e; b.vx-=(1+e)*vn*nx; b.vy-=(1+e)*vn*ny;
      }
      return -vn;
    }
    return 0;
  }

  /* ---------- main table interactions ---------- */
  featuresMain(b){
    for(const p of this.pops){
      if(!p.alive) continue;
      if(p.type==='hatch'&&this.hatchOpen>0&&this.canEnterBonus()) continue;   // open hatch is a mouth, not a wall
      const imp=this.hitPop(b,p); if(imp>15) this.onPop(p,imp);
    }
    for(const s of this.tsegs){
      if(s.drop&&!s.up) continue;
      const imp=this.hitSeg(b,s); if(imp>0) this.onSeg(s,imp);
    }
    const sp=Math.hypot(b.vx,b.vy);
    for(const r of this.rolls){
      if(this.time>r.cd&&Math.hypot(b.x-r.x,b.y-r.y)<r.r+1){ r.cd=this.time+0.6; this.onRoll(r); }
    }
    for(const s of this.spinners){
      if(Math.abs(b.x-s.x)<s.w/2+3&&Math.abs(b.y-s.y)<4){
        if(this.time>s.cd){ s.omega=clamp(sp*0.07,8,45); s.cd=this.time+0.15; }
        b.vx*=0.997; b.vy*=0.994;
      }
    }
    if(b.cool>0) return;
    if(this.hatchOpen>0&&this.canEnterBonus()&&Math.hypot(b.x-this.hatch.x,b.y-this.hatch.y)<7&&sp<520){ this.enterBonus(b); return; }
    for(const m of this.mouths){
      if(Math.hypot(b.x-m.x,b.y-m.y)<m.r-1&&sp<400){
        if(m.type==='throat'){ this.enterRail(b,this.tube,0); this.award(1500,m.x,m.y); this.say('DIGESTING','#c77dff'); this.registerHit(); }
        else this.lockHit(b,m);
        return;
      }
    }
    for(const r of this.rails){
      if(Math.hypot(b.x-r.pts[0][0],b.y-r.pts[0][1])<r.er){
        const t=r.tanAt(0), dot=b.vx*t[0]+b.vy*t[1];
        if(dot>r.minDot){ this.enterRail(b,r,dot); return; }
      }
    }
  }
  onSling(s,b){
  s.anim=1; this.award(50); this.sfx('sling',rnd(0.9,1.2)); this.registerHit();
  const B=this.bonus;
  if(this.mode==='bonus'&&B&&b){
    B.slingRun=(B.slingRun||0)+1;                    // consecutive sling hits with nothing else in between
    if(B.slingRun>3){ b.vx=rnd(-70,70); b.vy=-rnd(400,470); B.slingRun=0; this.sfx('eject'); this.burst(b.x,b.y,C.red3,8,100); }
  }
}
  onSeg(s,imp){
    if(s.target&&imp>35&&this.time>s.cd){
      s.cd=this.time+0.15; s.anim=1; const i=s.target.idx;
      this.stats.targets++; this.registerHit();
      if(!this.hive[i]){
        this.hive[i]=true; this.award(100,s.ax,s.ay); this.sfx('hive',1+i*0.12); this.say('TARGET HIT','#7dff3a');
        this.burst(s.ax,(s.ay+s.by)/2,C.grn3,6,80);
        if(this.hive.every(Boolean)) this.hiveComplete();
      } else { this.award(50); this.sfx('target',rnd(0.9,1.1)); }
    } else if(s.drop&&imp>30&&s.up){
      s.up=false; this.award(300,s.ax+6,s.ay); this.sfx('drop'); this.registerHit(); this.burst(s.ax+6,s.ay,C.bone,8,90);
      this.stats.targets++;
      if(this.drops.every(d=>!d.up)){
        this.award(5000,109,300); this.baseMult=Math.min(4,this.baseMult+1); this.dropResetT=1.4;
        this.say('JAWS DOWN','#d6e34a'); this.say('MULTIPLIER X'+this.baseMult,'#ffb02e'); this.sfx('rampDone');
      }
    }
  }
  onRoll(r){
    r.lit=1.5; r.on=true; this.award(250,r.x,r.y); this.sfx('blip',rnd(0.9,1.3)); this.registerHit(); this.stats.targets++;
    if(this.rolls.every(q=>q.on)){
      this.award(3000,109,320); this.say('ROLLOVER BONUS','#d6e34a'); this.sfx('rampDone');
      for(const q of this.rolls) q.on=false;
    }
  }
  onPop(p,imp){
    if(this.time<p.cd) return; p.cd=this.time+0.06; p.flash=0.18;
    switch(p.type){
      case 'bumper':
        this.award(p.score,p.x,p.y); this.registerHit(); this.stats.targets++; p.anim=1;
        this.sfx(p.core?'bumperBig':'bumper',rnd(0.85,1.2)); this.burst(p.x,p.y,p.core?C.orange:C.yel,p.core?9:5,110);
        if(p.core&&this.mb&&this.jackpotLit){ this.jackpotLit=false; this.award(20000,p.x,p.y); this.say('JACKPOT','#ffb02e'); this.bigMsg('JACKPOT','#ffb02e',1.5); this.flashA=0.6; this.flashCol='#ffb02e'; }
        break;
      case 'eye':
        this.award(p.score,p.x,p.y); this.registerHit(); this.sfx('bumper',rnd(1.3,1.7)); this.burst(p.x,p.y,C.grn3,5,90); break;
      case 'hatch':
        this.award(100); this.sfx('target',0.7); if(this.hatchOpen<=0) this.say('HATCH SEALED','#ff3b2e'); break;
      case 'egg':
        p.hp--; this.award(200,p.x,p.y); this.sfx('egg',rnd(0.9,1.2)); this.burst(p.x,p.y,C.pur3,7,100); this.registerHit();
        if(p.hp<=0){
          p.alive=false; this.stats.eggs++; this.award(2000,p.x,p.y); this.sfx('creatureDie'); this.burst(p.x,p.y,C.pur3,22,170);
          this.say('EGG SAC BURST','#c77dff');
          if(this.pops.filter(q=>q.type==='egg').every(q=>!q.alive)){
            this.award(10000,109,140); this.say('HIVE NEST CLEARED','#7dff3a'); this.awardExtra(); this.eggResetT=5;
          }
        }
        break;
      case 'creature':
        p.hp--; this.award(150,p.x,p.y); this.sfx('creatureHit',rnd(0.8,1.3)); this.burst(p.x,p.y,C.grn3,6,100); this.registerHit();
        if(p.hp===1) this.say('CRITICAL DAMAGE','#ff3b2e');
        if(p.hp<=0){
          p.alive=false; p.respawn=14; this.stats.aliens++; this.award(5000,p.x,p.y);
          this.sfx('creatureDie'); this.burst(p.x,p.y,C.grn3,24,190); this.say('ALIEN DESTROYED','#7dff3a'); this.flashA=0.25; this.flashCol='#7dff3a';
        }
        break;
    }
  }

  /* ---------- rails / ramps / tubes ---------- */
  enterRail(b,r,dot){
    b.state='rail'; b.rail=r; b.s=0; b.sp=r.tube?r.speed:Math.max(dot,r.minStart); b.railT=0; b.vx=b.vy=0; r.flash=1;
    this.sfx(r.tube?'tunnelIn':'rail');
  }
  stepRail(b,dt){
    const r=b.rail; b.railT+=dt;
    if(r.tube) b.s+=r.speed*dt;
    else { const t=r.tanAt(b.s); b.sp+=G*t[1]*dt; b.sp*=(1-0.2*dt); b.s+=b.sp*dt; }
    if(b.s>=r.len||b.railT>10){ this.exitRail(b,true); return; }
    if(b.s<=0){ this.exitRail(b,false); return; }
    const p=r.pointAt(b.s); b.x=p[0]; b.y=p[1]; b.vx=0; b.vy=0;
    if(Math.floor(b.railT*8)!==Math.floor((b.railT-dt)*8)&&!r.tube) this.sfx('roll');
  }
  exitRail(b,fwd){
    const r=b.rail; b.state='play'; b.rail=null; b.cool=0.6; b.still=0;
    if(fwd){
      const e=r.pts[r.pts.length-1], t=r.tanAt(r.len), sp=r.tube?r.speed+30:Math.max(b.sp,r.minExit);
      b.x=e[0]+t[0]*2; b.y=e[1]+t[1]*2; b.vx=t[0]*sp; b.vy=t[1]*sp;
      if(r.tube){ this.sfx('eject'); this.burst(b.x,b.y,C.pur3,8,90); this.say('SPIT OUT','#c77dff'); }
      else this.rampComplete(r);
    } else {
      const s0=r.pts[0], t=r.tanAt(0), sp=Math.max(Math.abs(b.sp),60);
      b.x=s0[0]-t[0]*2; b.y=s0[1]-t[1]*2; b.vx=-t[0]*sp; b.vy=-t[1]*sp;
    }
  }
  rampComplete(r){
    this.stats.ramps++; this.registerHit(); this.sfx('rampDone');
    if(this.mb&&this.jackpotLit){ this.jackpotLit=false; this.award(15000,109,200); this.say('JACKPOT','#ffb02e'); }
    else if(this.mb){ this.award(2500,109,200); this.jackpotLit=true; this.say('JACKPOT LIT','#ffb02e'); }
    else { this.award(2500,109,200); this.say('RAMP COMPLETE','#7dff3a'); }
    if(this.lastRamp&&this.lastRamp!==r&&this.time-this.lastRampT<8){ this.award(5000,109,170); this.say('ORBIT COMBO','#d6e34a'); }
    this.lastRamp=r; this.lastRampT=this.time; r.flash=1;
  }

  /* ---------- locks, multiball ---------- */
  lockHit(b,m){
    if(m.ball||this.mb||this.mbPending>0){      // occupied / multiball: the maw acts as a kicker
      b.vx=rnd(-110,110); b.vy=-rnd(260,330); b.cool=0.5; this.award(500,m.x,m.y); this.sfx('eject'); m.flash=1; this.burst(m.x,m.y,C.red3,6,100); return;
    }
    b.state='locked'; b.x=m.x; b.y=m.y; b.vx=b.vy=0; m.ball=b; m.flash=1;
    this.sfx('lock'); this.stats.locks++; this.award(1000,m.x,m.y); this.registerHit();
    const other=this.mouths.find(q=>q.type==='lock'&&q!==m);
    if(other.ball){ this.mbPending=1.1; this.say('BALL 2 LOCKED','#ff3b2e'); }
    else { this.say('BALL LOCKED','#ffb02e'); this.pendingServe++; }
  }
  startMultiball(){
    this.mb=true; this.jackpotLit=true; this.saver=8; this.saverArmed=false; this.mbPending=0;
    const locks=this.mouths.filter(m=>m.type==='lock'); let i=0;
    for(const m of locks){
      const b=m.ball; if(!b) continue;
      b.state='play'; b.cool=0.6; b.vx=(i?-1:1)*70; b.vy=130; m.ball=null; m.flash=1; i++;
    }
    this.award(5000,109,180); this.say('MULTIBALL','#ff3b2e'); this.say('BALL SAVER','#ffb02e'); this.bigMsg('MULTIBALL','#ff3b2e',2.2);
    this.sfx('multiball'); this.flashA=0.8; this.flashCol='#ff3b2e'; this.shake=0.6;
  }

  /* ---------- HIVE + bonus chamber ---------- */
  hiveComplete(){
    this.award(10000,109,200); this.hiveBoost=30; this.hatchOpen=30; this.hiveFlash=2; this.hiveResetT=2;
    this.bigMsg('HIVE COMPLETE','#7dff3a',2); this.say('HIVE COMPLETE','#7dff3a'); this.say('ORGANISM ACTIVATED','#ffb02e');
    this.sfx('hiveDone'); this.flashA=0.7; this.flashCol='#7dff3a'; this.shake=0.5;
  }
  canEnterBonus(){ return this.mode==='main'&&this.activeCount()===1&&!this.mouths.some(m=>m.ball)&&!this.balls.some(b=>b.state==='rail'); }
  
  cheatBonus(){
  if(this.phase!=='play'||this.tilt) return;
  const b=this.balls.find(q=>q.state==='play'&&!(q.x>217&&q.y>400));
  if(!b||!this.canEnterBonus()){ this.say('NOT NOW','#ff3b2e'); return; }
  this.enterBonus(b);
}
  
  enterBonus(b){
    this.mode='bonus'; b.state='play'; b.x=120; b.y=60; b.vx=rnd(-40,40); b.vy=180; b.cool=0.5; b.trail=[];
    this.bonus={t:45,wave:0,pool:2000,kills:0,clock:0,nextT:0,done:false,tick:0};
    this.hatchOpen=0; this.saver=0; this.blackout=1.3; this.flashA=0.8; this.flashCol='#ff3b2e';
    this.sfx('bonusStart'); this.say('BONUS CHAMBER','#ff3b2e'); this.bigMsg('BONUS CHAMBER','#ff3b2e',2);
    this.bpops=this.bonusBumpers.slice(); this.spawnWave(1);
  }
  spawnWave(n){
    const B=this.bonus; B.wave=n; this.aliens=[];
    const cnt=[0,5,7,9][n];
    for(let i=0;i<cnt;i++){
      const a=new Pop('larva',0,0,6,{hp:1,e:0.6});
      a.ox=rnd(60,160); a.oy=rnd(110,270); a.ax=rnd(15,38); a.ay=rnd(8,22);
      a.w1=rnd(0.6,1.5)*(1+0.25*n); a.w2=rnd(0.8,1.7); a.p1=rnd(0,TAU); a.p2=rnd(0,TAU);
      a.x=a.ox; a.y=a.oy; this.aliens.push(a);
    }
    this.bpops=this.bonusBumpers.concat(this.aliens); this.say('WAVE '+n,'#c77dff'); this.sfx('wave');
  }
  spawnBoss(){
    this.boss=new Pop('boss',109,105,20,{hp:12,hpMax:12,e:0.7});
    this.bpops=this.bonusBumpers.concat([this.boss]); this.bonus.wave=4;
    this.say('THE OVERMIND','#ff3b2e'); this.bigMsg('OVERMIND','#ff3b2e',1.6); this.sfx('bonusStart'); this.shake=0.5;
  }
  stepBonusActors(dt){
    const B=this.bonus; if(!B) return; B.clock+=dt;
    for(const a of this.aliens){ if(!a.alive) continue; a.x=a.ox+a.ax*Math.sin(a.w1*B.clock+a.p1); a.y=a.oy+a.ay*Math.sin(a.w2*B.clock+a.p2); }
    if(this.boss&&this.boss.alive){ this.boss.x=109+55*Math.sin(0.9*B.clock); this.boss.y=105+18*Math.sin(1.7*B.clock); }
  }
  featuresBonus(b){
    for(const s of this.slingSegs){ const imp=this.hitSeg(b,s); if(imp>40&&s.kick) this.onSling(s); }
    for(const p of this.bpops){
      if(!p.alive) continue;
      const imp=this.hitPop(b,p); if(imp>15) this.onBonusHit(p,b);
    }
  }
  onBonusHit(p,b){
  const B=this.bonus; if(!B||this.time<p.cd) return; p.cd=this.time+0.06; p.flash=0.18; B.slingRun=0;
  if(p.type==='bbump'){
    B.streak=(B.streak||0)+1;
    if(B.streak<=3) B.pool+=200;                       // stop the points farm too
    if(b){
      b.vx+=rnd(-70,70);                               // break up the perfect ping-pong
      if(B.streak>=3){ b.vx=rnd(-110,110); b.vy=-rnd(320,400); B.streak=0; }   // fire it at the aliens
    }
    this.sfx('bumper',rnd(1,1.4)); this.burst(p.x,p.y,C.pur3,5,100);
  }
  else if(p.type==='larva'){
    B.streak=0;
      p.alive=false; B.kills++; B.pool+=1000*B.wave; this.award(500,p.x,p.y); this.sfx('creatureDie'); this.burst(p.x,p.y,C.grn3,14,150);
      if(this.aliens.every(a=>!a.alive)){ B.nextT=0.9; }
    } else if(p.type==='boss'){
    B.streak=0;
      p.hp--; B.pool+=1500; this.sfx('creatureHit',rnd(0.7,1)); this.burst(p.x,p.y,C.red3,10,140); this.flashA=0.2; this.flashCol='#ff3b2e';
      if(p.hp===3) this.say('CRITICAL DAMAGE','#ff3b2e');
      if(p.hp<=0){ p.alive=false; this.burst(p.x,p.y,C.orange,40,230); this.completeBonus(true); }
    }
  }
  completeBonus(success){
    const B=this.bonus; if(!B||B.done) return; B.done=true;
    const total=B.pool+(success?25000:0); this.score+=total;
    this.say(success?'BONUS COMPLETE':'TIME UP','#ffb02e'); this.say(String(total),'#7dff3a');
    if(success){ this.bigMsg('JACKPOT','#ffb02e',1.6); this.awardExtra(); }
    const b=this.balls.find(q=>q.state==='play');
    this.mode='main'; this.bonus=null; this.bpops=[]; this.aliens=[]; this.boss=null; this.hatchOpen=0;
    if(b){ b.x=120; b.y=48; b.vx=rnd(-50,50); b.vy=260; b.cool=1.5; b.trail=[]; }
    this.sfx('eject'); this.blackout=0.4; this.flashA=0.7; this.flashCol='#ffffff'; this.shake=0.5;
  }

  /* ---------- drain ---------- */
  drainBall(b){
    const i=this.balls.indexOf(b); if(i>=0) this.balls.splice(i,1);
    if(this.saver>0&&!this.tilt){
      this.saver=0; this.say('BALL SAVED','#7dff3a'); this.sfx('saved'); this.spawnLaneBall(); return;
    }
    this.sfx('drain'); this.burst(clamp(b.x,8,208),438,C.red3,14,120);
    const act=this.activeCount();
    if(act===0) this.endBall();
    else if(act<=1&&this.mb){ this.mb=false; this.say('MULTIBALL OVER','#ffb02e'); }
  }

  /* ---------- per-frame timers and effects ---------- */
  timers(dt){
    this.shake=Math.max(0,this.shake-dt*2.2); this.flashA=Math.max(0,this.flashA-dt*2.2); this.blackout=Math.max(0,this.blackout-dt);
    if(this.nudgeCd>0) this.nudgeCd-=dt;
    if(this.hiveFlash>0) this.hiveFlash-=dt;
    if(this.saver>0){ this.saver-=dt; if(this.saver<0) this.saver=0; }
    if(this.hiveBoost>0) this.hiveBoost-=dt;
    if(this.hatchOpen>0&&this.mode==='main'){ this.hatchOpen-=dt; if(this.hatchOpen<=0){ this.hatchOpen=0; this.say('HATCH SEALED','#ff3b2e'); } }
    if(this.comboT>0){ this.comboT-=dt; if(this.comboT<=0) this.combo=0; }
    if(this.hiveResetT>0){ this.hiveResetT-=dt; if(this.hiveResetT<=0) this.hive=[false,false,false,false]; }
    if(this.dropResetT>0){ this.dropResetT-=dt; if(this.dropResetT<=0) for(const d of this.drops) d.up=true; }
    if(this.eggResetT>0){ this.eggResetT-=dt; if(this.eggResetT<=0) for(const p of this.pops) if(p.type==='egg'){ p.alive=true; p.hp=p.hpMax; } }
    for(const p of this.pops){
      if(p.flash>0) p.flash-=dt; if(p.anim>0) p.anim=Math.max(0,p.anim-dt*4);
      if(!p.alive&&p.respawn>0){ p.respawn-=dt; if(p.respawn<=0){ p.alive=true; p.hp=p.hpMax; } }
    }
    for(const p of this.bpops) if(p.flash>0) p.flash-=dt;
    for(const s of this.tsegs) if(s.anim>0) s.anim=Math.max(0,s.anim-dt*5);
    for(const s of this.slingSegs) if(s.anim>0) s.anim=Math.max(0,s.anim-dt*6);
    for(const r of this.rolls) if(r.lit>0) r.lit-=dt;
    for(const m of this.mouths) if(m.flash>0) m.flash=Math.max(0,m.flash-dt*2);
    for(const r of [this.rampA,this.rampB,this.tube]) if(r.flash>0) r.flash=Math.max(0,r.flash-dt*2);
    for(const s of this.spinners){
      s.ang+=s.omega*dt; s.omega*=Math.exp(-1.6*dt);
      const rot=Math.floor(s.ang/Math.PI);
      if(rot>s.last){ for(let k=s.last;k<rot;k++) this.award(100,s.x,s.y); s.last=rot; this.sfx('spinner',rnd(0.9,1.3)); }
    }
    // plunger / launcher
    const pl=this.plunger;
    if(pl.state==='charge'){
      pl.t+=dt;
      if(pl.t>=0.24){
        const b=pl.ball;
        if(b&&this.balls.includes(b)&&b.x>217&&b.y>400){
          b.vy=-(588+rnd(-10,10)); b.vx=0; this.sfx('launch');
          if(this.saverArmed){ this.saverArmed=false; this.saver=8; this.sfx('saverOn'); this.say('BALL SAVER','#ffb02e'); }
        }
        pl.state='release'; pl.t=0;
      }
    } else if(pl.state==='release'){ pl.t+=dt; if(pl.t>0.18){ pl.state='idle'; pl.t=0; } }
    if(this.pendingServe>0&&!this.laneOccupied()&&this.phase==='play'){ this.pendingServe--; this.balls.push(new Ball(227,428)); this.sfx('newBall'); }
    if(this.mbPending>0){ this.mbPending-=dt; if(this.mbPending<=0) this.startMultiball(); }
    // balls: trails + anti-stall
    for(const b of this.balls){
      if(b.state==='locked') continue;
      b.trail.push([b.x,b.y]); if(b.trail.length>8) b.trail.shift();
      if(b.state!=='play') continue;
      const sp=Math.hypot(b.vx,b.vy);
      if(sp<14&&!(b.x>217&&b.y>405)&&b.y<366){
        b.still+=dt;
        if(b.still>3){ b.still=0; b.vx=rnd(-90,90); b.vy=-rnd(150,230); this.sfx('eject'); this.burst(b.x,b.y,C.yel,8,80); }
      } else b.still=0;
    }
    // bonus chamber logic
    const B=this.bonus;
    if(B&&!B.done){
      B.t-=dt; B.tick+=dt;
      if(B.tick>=0.1){ B.tick=0; B.pool+=25*(B.wave||1); }
      if(B.nextT>0){ B.nextT-=dt; if(B.nextT<=0){ if(B.wave<3) this.spawnWave(B.wave+1); else this.spawnBoss(); } }
      if(B.t<=0) this.completeBonus(false);
    }
    // messages
    if(!this.msg&&this.msgQ.length){ this.msg=this.msgQ.shift(); if(this.msgQ.length>1) this.msg.dur=0.9; }
    if(this.msg){ this.msg.t+=dt; if(this.msg.t>=this.msg.dur) this.msg=null; }
    if(this.big){ this.big.t+=dt; if(this.big.t>=this.big.dur) this.big=null; }
    for(const f of this.floats){ f.t+=dt; } this.floats=this.floats.filter(f=>f.t<1);
    for(const p of this.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=240*dt; p.life-=dt; }
    this.parts=this.parts.filter(p=>p.life>0);
    // phases
    if(this.phase==='ending'){ this.phaseT+=dt; if(this.phaseT>=this.endDelay) this.nextBall(); }
    if(this.phase==='over'){
      this.overT+=dt; this.overBurstT-=dt;
      if(this.overT<3&&this.overBurstT<=0){ this.overBurstT=0.14; this.burst(rnd(30,210),rnd(40,200),Math.random()<0.5?C.red3:C.orange,14,200); this.shake=0.5; }
    }
  }
}

const pad=(n,l)=>String(Math.min(n,Math.pow(10,l)-1)).padStart(l,'0');

class Renderer{
  constructor(ctx){
    this.g=ctx; this.g.imageSmoothingEnabled=false;
    this.bgMain=this.bake('main'); this.bgBonus=this.bake('bonus');
  }
  /* ---- pixel primitives ---- */
  px(x,y,w,h,c){ this.g.fillStyle=c; this.g.fillRect(Math.round(x),Math.round(y),w,h); }
  disc(cx,cy,r,c){
    const g=this.g; g.fillStyle=c; r=Math.max(0,Math.round(r)); cx=Math.round(cx); cy=Math.round(cy);
    for(let dy=-r;dy<=r;dy++){ const w=Math.floor(Math.sqrt(r*r-dy*dy+0.5)); g.fillRect(cx-w,cy+dy,w*2+1,1); }
  }

      g.fillStyle='#2c3248'; for(let i=0;i<w;i+=6) g.fillRect(x+i+2,y+2,2,2); };

  drawOrgans(w,t){

const Keys={held:{}};
const Input={ get left(){ return !!(Keys.held.KeyZ||Keys.held.ArrowLeft); }, get right(){ return !!(Keys.held.KeyM||Keys.held.ArrowRight); } };
// Note: page scrolling is prevented by Phaser's addCapture() (see bindKeys) plus overflow:hidden in the CSS.
// Do NOT preventDefault() on window ourselves: Phaser ignores events that are already defaultPrevented.
window.addEventListener('blur',()=>{ Keys.held={}; });
let RD=null;

function bindKeys(scene,onPress){
  const kb=scene.input.keyboard;
  kb.addCapture('UP,DOWN,LEFT,RIGHT,SPACE,ENTER');
  const kd=e=>{ Keys.held[e.code]=true; SFX.init(); if(!e.repeat) onPress(e.code); };
  const ku=e=>{ Keys.held[e.code]=false; };
  kb.on('keydown',kd); kb.on('keyup',ku);
  scene.events.once('shutdown',()=>{ kb.off('keydown',kd); kb.off('keyup',ku); Keys.held={}; });
}
function getScreen(scene){
  if(!scene.textures.exists('screen')) scene.textures.createCanvas('screen',W,H);
  const tex=scene.textures.get('screen');
  if(!RD||RD.g!==tex.context) RD=new Renderer(tex.context);
  scene.add.image(0,0,'screen').setOrigin(0,0);
  return tex;
}

   NIDUS 10 second sci-fi intro.

        scene:[IntroScene,TitleScene,GameScene]

   Timeline (seconds after power-on):
     0.0 - 2.4   terminal boot log, typed

     7.1 - 9.0   the great eye opens in the dark: "IT IS HUNGRY"

  create(){
    this.tex=getScreen(this); this.t=0; this.gt=0; this.gate=true; this.done=false; this.fired=0; this.typed=0; this.sp=0.05;
    this.stars=[]; for(let i=0;i<110;i++) this.stars.push({x:rnd(-1,1),y:rnd(-1,1),z:rnd(0.05,1)});
    this.cues=[[0,'introBoot'],[2.2,'introWarp'],[5.0,'introAlarm'],[5.5,'introAlarm'],[6.0,'introAlarm'],[6.5,'introFlat'],[7.1,'introEye'],[9.0,'introSlam']];
    this.finish=()=>{ if(this.done) return; this.done=true; this.scene.start('Title'); };
    const poke=()=>{ SFX.init(); if(this.gate){ this.gate=false; this.t=0; } else this.finish(); };
    bindKeys(this,code=>{ if(code==='KeyQ'){ SFX.toggleMute(); return; } poke(); });
    this.input.on('pointerdown',poke);
  }
  speed(){
    if(this.gate) return 0.05; const t=this.t;
    if(t<2.2) return 0.05;
    if(t<3.0) return lerp(0.05,2.2,(t-2.2)/0.8);
    if(t<4.2) return 2.2;
    if(t<5.2) return lerp(2.2,0.12,(t-4.2)/1.0);
    return 0.1;
  }
  update(time,delta){
    if(this.done) return;
    const dt=Math.min(delta/1000,0.05);
    if(this.gate) this.gt+=dt;
    else {
      this.t+=dt;
      while(this.fired<this.cues.length&&this.t>=this.cues[this.fired][0]){ SFX.play(this.cues[this.fired][1]); this.fired++; }
      if(this.t>=15){ this.finish(); return; }
    }
    this.sp=this.speed();
    for(const s of this.stars){ s.z-=this.sp*dt; if(s.z<=0.03){ s.z=1; s.x=rnd(-1,1); s.y=rnd(-1,1); } }
    this.paint(); this.tex.refresh();
  }
  centre(r,str,y,s,c,sh){ r.txt(str,Math.round((W-r.txtW(str,s))/2),y,s,c,sh); }
  glitch(r,p){
    if(Math.random()>=p) return;
    const h=Math.round(rnd(3,14)), y=Math.round(rnd(0,H-h)), o=Math.round(rnd(-14,14));
    r.g.drawImage(r.g.canvas,0,y,W,h,o,y,W,h);
  }
  paint(){
    const r=RD, t=this.t; r.begin();
    if(this.gate){
      this.drawStars(r);
      this.centre(r,'KERES-9 DEEP STATION',170,1,C.grn2);
      this.centre(r,'SYSTEM STANDBY',184,1,'#4c5468');
      if(Math.floor(this.gt*2)%2===0) this.centre(r,'PRESS ANY KEY TO POWER ON',222,1,C.white);
      return;
    }
    if(t<7.0){ this.drawStars(r); if(t>=2.8) this.planet(r,t); }
    if(t<2.4) this.terminal(r,t);
    if(t>=2.2&&t<7.0) this.hud(r,t);
    if(t>=5.0&&t<7.0) this.alarm(r,t);
    if(t>=7.1&&t<9.0) this.eyeScene(r,t);
    if(t>=9.0) this.titleSlam(r,t);
    this.glitch(r,t>=5.0&&t<7.0?0.5:(t>=9.0&&t<9.5?0.8:0.03));
    if(t<9) this.centre(r,'PRESS ANY KEY TO SKIP',H-14,1,'#3a4a3a');
  }
  drawStars(r){
    for(const s of this.stars){
      const x=180+s.x/s.z*90, y=224+s.y/s.z*110; if(x<0||x>=W||y<0||y>=H) continue;
      const b=clamp(1.2-s.z,0.15,1), col=b>0.8?'#f4f4ff':(b>0.5?'#8a94a8':'#4c5468');
      if(this.sp>0.5){ const pz=s.z+this.sp*0.035; r.line(180+s.x/pz*90,224+s.y/pz*110,x,y,col,1); }
      else r.px(x,y,b>0.7?2:1,b>0.7?2:1,col);
    }
  }
  terminal(r,t){
    const L=[[0.1,'> KERES-9 DEEP STATION',C.grn3],[0.6,'> UPLINK ESTABLISHED',C.grn3],[1.1,'> LONG RANGE SCAN...',C.grn3],[1.5,'> ANOMALY: SECTOR 7',C.yel],[1.9,'> ALTERING COURSE',C.yel]];
    let total=0, last=-1, lastN=0;
    L.forEach((l,i)=>{
      const n=clamp(Math.floor((t-l[0])*45),0,l[1].length); total+=n;
      if(n>0){ r.txt(l[1].slice(0,n),16,150+i*14,1,l[2]); last=i; lastN=n; }
    });
    if(total>this.typed) SFX.play('introKey'); this.typed=total;
    if(last>=0&&Math.floor(t*4)%2===0) r.px(16+lastN*6,150+last*14,5,7,C.grn3);
  }
  planet(r,t){
    const k=clamp((t-2.8)/2.6,0,1), e=1-Math.pow(1-k,3), R=Math.round(4+e*74), cx=180, cy=236;
    const bands=['#1a0e28','#2b0f2f','#431549','#2b0f2f','#1d5a12','#431549'], bh=Math.max(3,Math.round(R/5));
    for(let dy=-R;dy<=R;dy++){
      const w=Math.floor(Math.sqrt(R*R-dy*dy+0.5)), band=bands[Math.floor((dy+R)/bh)%bands.length];
      r.px(cx-w,cy+dy,w*2+1,1,band);
      const sh=Math.floor(w*0.35); r.px(cx+sh,cy+dy,w-sh+1,1,'rgba(0,0,0,0.55)');
    }
    r.ring(cx,cy,R+2,C.grn1);
    if(R>40&&t>4.4){ const px0=cx-Math.round(R*0.3), py0=cy-Math.round(R*0.2); r.px(px0-1,py0-1,3,3,C.red3); r.ring(px0,py0,3+(t*6)%8,C.red2); }
  }
  hud(r,t){
    const s=14;
    for(const q of [[6,6,1,1],[W-6,6,-1,1],[6,H-6,1,-1],[W-6,H-6,-1,-1]]){
      const hx=q[2]>0?q[0]:q[0]-s, vy=q[3]>0?q[1]:q[1]-s; r.px(hx,q[1],s,1,C.grn2); r.px(q[0],vy,1,s,C.grn2);
    }
    r.txt('KERES-9 DEEP STATION',16,14,1,C.grn3); r.txt('SECTOR 7',16,26,1,C.grn2);
    const k=clamp((t-2.2)/3,0,1);
    r.txt('RANGE '+(12-11.6*k*k).toFixed(1)+' AU',16,H-26,1,C.grn3);
    if(t<4.4){ if(Math.floor(t*4)%2===0) r.txt('SCANNING...',16,H-38,1,C.grn2); }
    else r.txt('SOURCE LOCKED',16,H-38,1,C.yel);
  }
  alarm(r,t){
    const g=r.g, a=t-5.0;
    g.globalAlpha=0.10+0.12*Math.abs(Math.sin(a*6.3)); g.fillStyle='#ff1010'; g.fillRect(0,0,W,H); g.globalAlpha=1;
    r.px(30,40,300,120,'rgba(0,0,0,0.7)');
    if(Math.floor(a*5)%2===0) this.centre(r,'WARNING',52,4,C.red3,'#000');
    this.centre(r,'BIOSIGNAL DETECTED',100,2,C.yel,'#2a1a00');
    this.centre(r,'UNKNOWN ORGANISM - SECTOR 7',128,1,C.white);
    this.centre(r,'THE FEEDING PIT',142,1,C.orange);
    r.px(30,200,300,110,'rgba(0,0,0,0.7)'); r.px(30,200,300,1,C.grn1); r.px(30,309,300,1,C.grn1);
    r.txt('CREW LIFE SIGNS',40,208,1,C.grn3);
    const crew=Math.max(0,12-Math.floor(Math.max(0,t-5.2)/0.11));
    r.txt('CREW',250,208,1,C.grn3); r.led(String(crew).padStart(2,'0'),282,204,2,crew?'#7dff3a':'#ff3b2e','#0a2008');
    let py=262;
    for(let x=36;x<=324;x+=3){
      let y=262;
      if(t<6.5){
        const p=(((x+a*160)%96)+96)%96/96;
        y+=p>0.40&&p<0.47?-34*Math.sin((p-0.40)/0.07*Math.PI):(p>0.47&&p<0.52?12*Math.sin((p-0.47)/0.05*Math.PI):(p<0.12?-5*Math.sin(p/0.12*Math.PI):0));
        if(a>1.0) y+=rnd(-4,4)*clamp(a-1.0,0,1);
      }
      if(x>36) r.line(x-3,py,x,y,t<6.5?C.grn3:C.red3,1);
      py=y;
    }
    if(t>=6.5&&Math.floor(t*4)%2===0) this.centre(r,'FLATLINE',290,1,C.red3);
  }
  eyeScene(r,t){
    const e=t-7.1, ex=180, ey=214, shk=e>1.4?Math.round(rnd(-1,1)*Math.min(2,(e-1.4)*2)):0, cx=ex+shk, pu=Math.sin(t*2)*2;
    for(let i=0;i<14;i++){
      const a=i/14*TAU+0.2; let x=cx+Math.cos(a)*34, y=ey+Math.sin(a)*34;
      for(let k=0;k<5;k++){ const nx=x+Math.cos(a+Math.sin(t+i+k)*0.3)*6, ny=y+Math.sin(a+Math.sin(t+i+k)*0.3)*6; r.line(x,y,nx,ny,i&1?C.red1:C.red2,1); x=nx; y=ny; }
    }
    r.disc(cx,ey,36+pu*0.5,'#10040a'); r.disc(cx,ey,34+pu*0.5,C.yel); r.disc(cx,ey,30,'#c9d34a');
    const look=Math.sin(t*0.8)*8; r.disc(cx+look,ey,19,C.grn1); r.disc(cx+look,ey,16,C.grn2); r.disc(cx+look,ey,11,C.grn3);
    const pw=Math.round(2+clamp(e/1.9,0,1)*6); r.px(cx+look-pw/2,ey-16,pw,32,'#000'); r.px(cx+look-5,ey-8,3,3,C.white);
    const k=clamp((e-0.2)/1.0,0,1), ease=k*k*(3-2*k), cov=Math.round((1-ease)*90);
    if(cov>0){ r.px(ex-90,ey-90,180,cov,'#000'); r.px(ex-90,ey+90-cov,180,cov,'#000'); }
    const msg='IT IS HUNGRY', n=clamp(Math.floor((t-7.9)*14),0,msg.length);
    if(n>0) r.txt(msg.slice(0,n),Math.round((W-r.txtW(msg,2))/2),300,2,C.red3,'#000');
  }
  titleSlam(r,t){
    const e=t-9.0, g=r.g, title='NIDUS', tx=Math.round((W-r.txtW(title,8))/2), ty=150;
    r.disc(180,190,110,'#12050c'); r.disc(180,190,70,'#1a0610');
    if(e<0.35){ g.globalAlpha=1-e/0.35; g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.globalAlpha=1; }
    const j=e<0.5?Math.round(rnd(-6,6)*(1-e/0.5)):0;
    if(e<0.8){ g.globalAlpha=0.7; r.txt(title,tx+j-3,ty,8,'#ff2020'); r.txt(title,tx+j+3,ty,8,'#20e0ff'); g.globalAlpha=1; }
    r.txt(title,tx+j,ty,8,C.grn3,C.red1);
    if(e>0.4) this.centre(r,'THE FEEDING PIT',218,2,C.yel,'#2a1a00');
    if(e>0.8) this.centre(r,'FEED IT. OR BE FED UPON.',248,1,C.pur3);
  }
}


class TitleScene extends Phaser.Scene{
  constructor(){ super('Title'); }
  create(){
    this.tex=getScreen(this); this.t=0;
    this.demo=new Pinball(true,{left:false,right:false});
    const go=()=>{ if(this.started) return; this.started=true; SFX.init(); this.scene.start('Game'); };
    bindKeys(this,code=>{ if(code==='Enter'||code==='ArrowDown'||code==='Space') go(); if(code==='KeyQ') SFX.toggleMute(); });
    this.input.on('pointerdown',go);
  }
  update(time,delta){
    const dt=Math.min(delta/1000,0.05); this.t+=dt; this.demo.update(dt);
    RD.drawTitle(this.demo,this.t,Store.get()); this.tex.refresh();
  }
}
class GameScene extends Phaser.Scene{
  constructor(){ super('Game'); }
  create(){
    this.tex=getScreen(this);
    this.w=new Pinball(false,Input); SFX.startDrone();
    bindKeys(this,code=>{
      const w=this.w;
      if(code==='Enter'||code==='ArrowDown'){ if(w.phase==='over'){ if(w.overT>1.5){ w.newGame(); SFX.startDrone(); } } else w.launch(); }
      else if(code==='Space') w.nudge();
      else if(code==='Backquote') w.debug=!w.debug;
      else if(code==='KeyI'||code==='KeyO'){ if(Keys.held.KeyI&&Keys.held.KeyO) w.cheatBonus(); }
      else if(code==='KeyQ') SFX.toggleMute();
      else if(code==='Minus') MUSIC.setVol(MUSIC.vol-0.05);
else if(code==='Equal') MUSIC.setVol(MUSIC.vol+0.05);
      else if(code==='Escape'){ SFX.stopDrone(); this.scene.start('Title'); }
    });
    this.wasOver=false;
  }
  update(time,delta){
    const dt=Math.min(delta/1000,0.05), w=this.w;
    w.update(dt);
    if(w.phase==='over'&&!this.wasOver){ SFX.stopDrone(); }
    this.wasOver=w.phase==='over';
    RD.drawGame(w); this.tex.refresh();
  }
}

if(typeof Phaser==='undefined'){ document.getElementById('err').style.display='block'; }
else {
  new Phaser.Game({
    type:Phaser.AUTO, parent:'game', width:W, height:H, backgroundColor:'#000000',
    pixelArt:true, antialias:false, roundPixels:true,
    render:{pixelArt:true,antialias:false,roundPixels:true},
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
    fps:{target:60},
    scene:[IntroScene,TitleScene,GameScene]
  });
}
