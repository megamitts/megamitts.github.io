<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightspeed</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: black;
        }

        #text-box {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
            font-family: sans-serif;
            
            user-select: none;
            width: 600px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
			flex-direction: column;
            z-index: 10;
        }

        #text-box p {
            margin: 5px 0;
        }

		#text-box a {
            color: white;
            text-decoration: none;
            margin: 5px 0; /* Add margin to create space between the <a> tag and the <p> tags */
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="text-box">
        <p>Credits</p>
		<p>Code: Megamitts</p>
		<p>Graphics: Various free sources around the web</p>
		<p>Monty Python font: Christian Munk</p>
		<p>This effect: Matthias Hurrle (@atzedent)</p>
		<p></p>
		
		<a href="index.html" style="color: white; text-decoration: none;"><img src="gfx/socrates.png" width = "100" height = "100"></a>
		<p></p>
    </div>
    <canvas id="glCanvas"></canvas>
    <script type="x-shader/x-fragment" id="fragmentShader">#version 300 es
/*********
* made by Matthias Hurrle (@atzedent)
*/   
precision highp float;
out vec4 O;
uniform float time;
uniform vec2 resolution;
#define FC gl_FragCoord.xy
#define R resolution
#define T time
#define hue(a) (.6+.6*cos(6.3*(a)+vec3(0,83,21)))
float rnd(float a) {
    vec2 p=fract(a*vec2(12.9898,78.233));	p+=dot(p,p*345.);
    return fract(p.x*p.y);
}
vec3 pattern(vec2 uv) {
    vec3 col=vec3(0);
    for (float i=.0; i++<20.;) {
        float a=rnd(i);
        vec2 n=vec2(a,fract(a*34.56)), p=sin(n*(T+7.)+T*.5);
        float d=dot(uv-p,uv-p);
        col+=.00125/d*hue(dot(uv,uv)+i*.125+T);
    }
    return col;
}
void main(void) {
    vec2 uv=(FC-.5*R)/min(R.x,R.y);
    vec3 col=vec3(0);
    float s=2.4,
    a=atan(uv.x,uv.y),
    b=length(uv);
    uv=vec2(a*5./6.28318,.05/tan(b)+T);
    uv=fract(uv)-.5;
    col+=pattern(uv*s);
    O=vec4(col,1);
}
    </script>
    <script src="scripts/credits_script.js"></script>
</body>
</html>
