<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <style>
        @font-face {
            font-family: Spartacus;
            src: url('spartacus.ttf');
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #f5f5f0;
            background-image: url('columns.png');
            
            background-repeat: no-repeat; /* Prevent columns from repeating */
            background-size: cover; /* Ensure the background covers the whole area */
            background-position: center; /* Center the background image */
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            cursor: url("sweezy_pointer.png"), auto;
        }
        
    .main-wrapper {
    display: flex;
    flex-direction: column; /* Stack items vertically */
    align-items: stretch;   /* Center items horizontally within wrapper*/
    max-width: 800px ; /* Take up full width of body */
    width:100%;
    }

    .link-container {
    display: flex; /* Make it a flex container */
    justify-content: space-between; /* Align items to ends */
    width: 100%; /* Ensure it takes full width */
    margin-top: 20px; /* Add spacing above the links */
}

    .linksforward {
    margin-top: 20px; /* Add spacing between the card and the link*/
    align-self: flex-end;   
    
    }

    .linksback {
    margin-top: 20px; /* Add spacing between the card and the link*/
    align-self: flex-start;      
    
    }

        h1 {
            font-family: 'Spartacus';
            font-size: 80px;
            color: #765b46;
            margin-bottom: 30px;
            text-align: center;
        }

        .container {
            
            width: 100%;
            text-align: center;
            cursor: url("pointer.png"), auto; 
            
        }
        
        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 40px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            min-height: 200px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .quote {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
        }
        
        .philosopher {
            font-style: italic;
            color: #666;
            font-size: 18px;
            margin-top: 20px;
        }
        
        .tag {
            display: inline-block;
            background-color: #e0e0e0;
            border-radius: 20px;
            padding: 5px 12px;
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
        
        .epicurus {
            background-color: #d1e8df;
            color: #2e7d5b;
        }
        
        .seneca {
            background-color: #d6e0f0;
            color: #3a548c;
        }
        
        .socrates {
            background-color: #d1e8df;
            color: white /* colour of text in button */
            //color: #2e7d5b;
        }
        
        button {
            background-color:  white  /* #4a6fa5; */
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: url("pointer.png"), auto;                    
            transition: background-color 0.3s ease;
        } 
        
        .new-btn:hover{
            background-color: white;
            cursor: url("sweezy_pointer.png"), auto;
        } 
        
        
        
        .filters {
            margin-bottom: 20px;
        }
        
        .filter-btn {
            background-color: #e0e0e0;
            color: #555;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: url("sweezy_pointer.png"), auto;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .filter-btn:hover {
            background-color: #3a548c;
            color: white;
        }
        

        .filter-btn.active {
            background-color: #4a6fa5;
            color: white;
        }

        

        .new-btn {
            background-color: white;
            color: #555;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: url("sweezy_pointer.png"), auto;
            transition: all 0.3s ease;
        }
        
            
        /* Media query for mobile devices */
@media (max-width: 768px) {
    body {
        background-image: none; /* Remove background image on mobile */
        background-color: #f5f5f0; /* Keep the background color */
        padding: 10px; /* Adjust padding for smaller screens */
    }

    .container{
      margin-left: 0px;
      width: 95% /* Take up more of the width for mobile*/
    }

    .card {
        padding: 20px; /* Adjust padding for smaller screens */
        margin-bottom: 10px; /* less margin between cards */

    }

    .quote {
        font-size: 18px; /* reduce font size for mobile*/

    }

    h1 {
        font-size: 24px; /* Reduce h1 font size for mobile */
        margin-bottom: 20px;
    }

    .pic {
        width: 150px; /* Adjust image size */
        height: 150px;
    }

    .filter-btn {
            margin-bottom: 10px;
    }
}
        


    </style>
</head>
<body>
    
   <div class="main-wrapper"> 
    <div class="container">
        <h1>Ancient Wisdom</h1>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
          
            <button class="filter-btn" data-filter="hypatia">Hypatia</button>
            
           
            
            
           
            <button class="filter-btn" data-filter="epicurus">Epicurus</button>
            <button class="filter-btn" data-filter="seneca">Seneca</button>
            <button class="filter-btn" data-filter="socrates">Socrates</button>
            <button class="filter-btn" data-filter="aurelius">Aurelius</button>
            <button class="filter-btn" data-filter="epictetus">Epictetus</button>
        </div>
        
        <div class="card">
            <p class="quote" id="quote">Click the philosopher below for wisdom to help you through your journey.</p>
            <p class="philosopher" id="philosopher"></p>
            <span class="tag" id="tag"></span>
            <button class="new-btn" id="new-quote">
            <img src="philosopher.png" width="200" height="200" alt="Philosopher"></button>


            
        </div>
        
        
        
       
        
    </div>
    <div class="link-container">
        
    
        <a class="linksback" href="1700s.html">1700s</a>
        <a class="linksforward" href="1800s.html">1800s</a>
    </div>

    </div>
    
    <script>
        const quotes = [
            
            // Hypatia quotes
            {
                text: "Reserve your right to think, for even to think wrongly is better than not to think at all.",
                philosopher: "Hypatia",
                tag: "hypatia",
                theme: "Self"
            },

            {
                text: "Life is an unfoldment, and the further we travel the more truth we can comprehend. To understand the things that are at our door is the best preparation for understanding those that lie beyond.",
                philosopher: "Hypatia",
                tag: "hypatia",
                theme: "Exposure"
            },

            {
                text: "All formal dogmatic religions are fallacious and must never be accepted by self-respecting persons as final.",
                philosopher: "Hypatia",
                tag: "hypatia",
                theme: "Religion"
            },

            {
                text: "In fact men will fight for a superstition quite as quickly as for a living truth - often more so, since a superstition is so intangible you cannot get at it to refute it, but truth is a point of view, and so is changeable.",
                philosopher: "Hypatia",
                tag: "hypatia",
                theme: "Truth"
            },

            {
                text: "Fables should be taught as fables, myths as myths, and miracles as poetic fantasies. To teach superstitions as truths is a most terrible thing. The child mind accepts and believes them, and only through great pain and perhaps tragedy can he be in after years relieved of them.",
                philosopher: "Hypatia",
                tag: "hypatia",
                theme: "Truth"
            },


            // Socrates quotes
            {
                text: "He is a man of courage who does not run away, but remains at his post and fights against the enemy.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Courage"
            },
        
            {
                text: "It is better to make a mistake with full force of your being than to carefully avoid mistakes with a trembling spirit.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Courage"
            },

            {
                text: "If you want to be wrong then follow the masses.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Society"
            },

            {
                text: "The secret of happiness, you see, is not found in seeking more, but in developing the capacity to enjoy less.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Happiness"
            },

            {
                text: "We are what we repeatedly do. Excellence then is a habit.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Self"
            },

            {
                text: "The wisest man alive knows but one thing: That he knows nothing.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Modesty"
            },

            {
                text: "From the deepest desires often comes the deadliest hate.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Temperance"
            },

            {
                text: "Wonder is the beginning of wisdom.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Imagination"
            },

            {
                text: "Be slow to fall into friendship; but when thou art in, continue firm and constant.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Friendship"
            },

            {
                text: "Do not do to others what angers you if done to you by others.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Empathy"
            },

            {
                text: "Slanderers do not hurt me because they do not hit me.",
                philosopher: "Socrates",
                tag: "socrates",
                theme: "Empathy"
            },

            // Epicurus quotes
            {
                text: "Do not spoil what you have by desiring what you have not; remember that what you now have was once among the things you only hoped for.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Contentment"
            },
            {
                text: "Death does not concern us, because as long as we exist, death is not here. And when it does come, we no longer exist.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Fear"
            },
            {
                text: "It is impossible to live a pleasant life without living wisely and well and justly, and it is impossible to live wisely and well and justly without living pleasantly.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Pleasure"
            },
            {
                text: "The art of living well and the art of dying well are one.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Life"
            },
            {
                text: "The greater the difficulty, the more the glory in surmounting it.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Challenges"
            },
            {
                text: "Not what we have but what we enjoy constitutes our abundance.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Wealth"
            },
            {
                text: "Of all the things which wisdom provides to make us entirely happy, much the greatest is the possession of friendship.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Friendship"
            },
            {
                text: "Pleasure is the beginning and the end of living happily.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Pleasure"
            },
            {
                text: "Empty is the argument of the philosopher who does not relieve any human suffering.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Philosophy"
            },
            {
                text: "The wise person does not dread the moment of death.",
                philosopher: "Epicurus",
                tag: "epicurus",
                theme: "Death"
            },
            
            // Seneca quotes
            {
                text: "It is not the man who has too little, but the man who craves more, that is poor.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Wealth"
            },
            {
                text: "We suffer more often in imagination than in reality.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Anxiety"
            },
            {
                text: "Luck is what happens when preparation meets opportunity.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Fortune"
            },
            {
                text: "Difficulties strengthen the mind, as labor does the body.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Resilience"
            },
            {
                text: "The greatest obstacle to living is expectancy, which hangs upon tomorrow and loses today.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Present"
            },
            {
                text: "If a man knows not to which port he sails, no wind is favorable.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Purpose"
            },
            {
                text: "The bravest sight in the world is to see a great man struggling against adversity.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Courage"
            },
            {
                text: "Begin at once to live, and count each separate day as a separate life.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Life"
            },
            {
                text: "No person has the power to have everything they want, but it is in their power not to want what they don't have.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Desire"
            },
            {
                text: "True happiness is to enjoy the present, without anxious dependence upon the future.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Happiness"
            },
            {
                text: "He who is brave is free.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Freedom"
            },
            {
                text: "Sometimes even to live is an act of courage.",
                philosopher: "Seneca",
                tag: "seneca",
                theme: "Perseverance"
            },

            // Aurelius quotes
            {
                text: "You have power over your mind - not outside events. Realise this, and you will find strength.",
                philosopher: "Marcus Aurelius",
                tag: "aurelius",
                theme: "Mind"
            },
            
            {
                text: "Live a good life. If there are gods and they are just, then they will not care how devout you have been, but will welcome you based on the virtues you have lived by. If there are gods, but unjust, then you should not want to worship them. If there are no gods, then you will be gone, but will have lived a noble life that will live on in the memories of your loved ones.",
                philosopher: "Marcus Aurelius",
                tag: "aurelius",
                theme: "Life"
            },
            
            {
                text: "When another blames you or hates you, or people voice similar criticisms, go to their souls, penetrate inside and see what sort of people they are. You will realise that there is no need to be racked with anxiety that they should hold any particular opinion about you.",
                philosopher: "Marcus Aurelius",
                tag: "aurelius",
                theme: "Self"
            },

            {
                text: "The happiness of your life depends upon the quality of your thoughts.",
                philosopher: "Marcus Aurelius",
                tag: "aurelius",
                theme: "Mind"
            },
            
            {
                text: "Do not act as if you were going to live ten thousand years. Death hangs over you. While you live, while it is in your power, be good.",
                philosopher: "Marcus Aurelius",
                tag: "aurelius",
                theme: "Morality"
            },

            {
                text: "You don’t love yourself enough. Or you’d love your nature too, and what it demands of you.",
                philosopher: "Marcus Aurelius",
                tag: "aurelius",
                theme: "Self"
            },
            
            {
                text: "The object of life is not to be on the side of the majority, but to escape finding oneself in the ranks of the insane.",
                philosopher: "Marcus Aurelius",
                tag: "aurelius",
                theme: "Self"
            },

            // Epictetus quotes

            
            {
                text: "Wealth consists not in having great possessions, but in having few wants.",
                philosopher: "Epictetus",
                tag: "epictetus",
                theme: "Wealth"
            },
            
            {
                text: "It's not what happens to you, but how you react to it that matters.",
                philosopher: "Epictetus",
                tag: "epictetus",
                theme: "Mind"
            },
                        
            
            {
                text: "First say to yourself what you would be; and then do what you have to do.",
                philosopher: "Epictetus",
                tag: "epictetus",
                theme: "Self"
            },
            
            {
                text: "If anyone tells you that a certain person speaks ill of you, do not make excuses about what is said of you but answer, 'He was ignorant of my other faults, else he would not have mentioned these alone.'",
                philosopher: "Epictetus",
                tag: "epictetus",
                theme: "Self"
            },

            {
                text: "If you want to improve, be content to be thought foolish and stupid.",
                philosopher: "Epictetus",
                tag: "epictetus",
                theme: "Self"
            }
            
            
           
            
                
        ];

        let currentFilter = 'all';
        
        const quoteElement = document.getElementById('quote');
        const philosopherElement = document.getElementById('philosopher');
        const tagElement = document.getElementById('tag');
        const newQuoteButton = document.getElementById('new-quote');
        const filterButtons = document.querySelectorAll('.filter-btn');
        
        function getFilteredQuotes() {
            if (currentFilter === 'all') {
                return quotes;
            } else {
                return quotes.filter(quote => quote.tag === currentFilter);
            }
        }
        
        function displayRandomQuote() {
            const filteredQuotes = getFilteredQuotes();
            const randomIndex = Math.floor(Math.random() * filteredQuotes.length);
            const randomQuote = filteredQuotes[randomIndex];
            
            quoteElement.textContent = randomQuote.text;
            philosopherElement.textContent = `— ${randomQuote.philosopher}`;
            tagElement.textContent = randomQuote.theme;
            tagElement.className = `tag ${randomQuote.tag}`;
        }
        
        newQuoteButton.addEventListener('click', displayRandomQuote);
        
        filterButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Update active button
                filterButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                
                // Update filter
                currentFilter = this.getAttribute('data-filter');
                
                // Display new quote with the filter
                displayRandomQuote();
            });
        });
        
        // Initial quote
        //displayRandomQuote();
    </script>
    <script>

        // Title Scroller

        (function titleScroller(text) {
    document.title = text;
    setTimeout(function () {
        titleScroller(text.substr(1) + text.substr(0, 1));
    },75);
}("      Ancient Wisdom: The Teachings of Hypatia, Epicurus, Seneca, Socrates, Aurelius and Epictetus.      "));
    </script>
    
</body>
</html>
