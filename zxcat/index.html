<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZX Cat Platformer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="myAudio" preload="auto" loop>
  <source src="prosto_popsa_shiru8bit.mp3" type="audio/mpeg">
</audio>
<audio id="winAudio" preload="auto">
	<source src="round_end.wav" type="audio/wav">
</audio>
<audio id="deathAudio" preload="auto">
	<source src="death.wav" type="audio/wav">
</audio>
<audio id="jumpAudio" preload="auto">
	<source src="jump.wav" type="audio/wav">
</audio>
<audio id="hitAudio" preload="auto">
	<source src="hit.wav" type="audio/wav">
</audio>
<audio id="collectAudio" preload="auto">
	<source src="collect.wav" type="audio/wav">
</audio>


    <div class="game-container">
        <div class="hud">
            <span>SCORE: <span id="score">0</span></span>
            <span>LIVES: <span id="lives">3</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="message" class="message-overlay" style="display: none;"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
